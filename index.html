<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>植物大战僵尸 · Web 原版复刻版</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1a1206; overflow: hidden; }
  #wrap { display: flex; align-items: center; justify-content: center; height: 100%; }
  canvas { max-width: 100vw; max-height: 100vh; aspect-ratio: 4/3; image-rendering: auto; cursor: pointer;
           box-shadow: 0 0 40px rgba(0,0,0,0.6); }
  #overlay { position: fixed; inset: 0; background: linear-gradient(160deg,#241a08,#0d0904); color: #ffe9a8;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; z-index: 10; }
  #overlay h1 { font-size: 34px; margin-bottom: 8px; color: #c8f542; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
  #loadtext { font-size: 15px; opacity: .85; margin-bottom: 18px; }
  #loadbarwrap { width: 340px; height: 10px; background: rgba(255,255,255,.12); border-radius: 6px; overflow: hidden; }
  #loadbar { height: 100%; width: 0%; background: linear-gradient(90deg,#5ad04a,#c8f542); border-radius: 6px; transition: width .2s; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="800" height="600"></canvas></div>
<div id="overlay">
  <h1>植物大战僵尸 · Web 原版复刻版</h1>
  <div id="loadtext">正在准备…</div>
  <div id="loadbarwrap"><div id="loadbar"></div></div>
</div>
<script>
// ---- CommonJS 风格模块加载器 (开发模式: fetch js/ + assets/) ----
window.__mods = {};
window.require = function (name) {
  const key = name.replace(/^\.\//, '').replace(/\.js$/, '');
  const m = window.__mods[key];
  if (!m) { console.error('模块未加载:', key); return {}; }
  return m;
};
(async function () {
  // 1. 资产清单
  let imageList = [];
  try {
    const man = await (await fetch('assets/manifest.json', { cache: 'no-store' })).json();
    imageList = man.images || [];
  } catch (e) { console.error('manifest 加载失败', e); }
  window.__IMAGE_LIST__ = imageList;
  // 2. reanim JSON (fetch)
  try {
    const r = await fetch('assets/reanim/_list.json', { cache: 'no-store' });
    if (r.ok) window.__REANIM_LIST__ = await r.json();
  } catch (e) {}
  // 3. 模块 (依赖顺序: data/reanim 先, zombies 在 board 前)
  const files = ['reanim', 'data', 'assets', 'audio', 'cutscene', 'projectiles', 'zombies', 'plants', 'board', 'render', 'ui', 'screens', 'main'];
  for (const f of files) {
    try {
      const res = await fetch(`js/${f}.js?v=${window.__BUILD__ || Date.now()}`, { cache: 'no-store' });
      const src = await res.text();
      const fn = new Function('module', 'require', src + '\n;return module.exports;');
      const mod = { exports: {} };
      window.__mods[f] = fn(mod, window.require);
      if (f === 'assets') window.Assets = window.__mods[f];
    } catch (e) {
      console.error('模块加载失败:', f, e);
      const lt = document.getElementById('loadtext');
      if (lt) lt.textContent = '模块加载失败: ' + f + ' — ' + e.message;
    }
  }
  // 4. 启动
  const Game = window.__mods['main'] && window.__mods['main'].Game;
  if (Game) {
    window.Game = Game;
    Game.boot();
  } else {
    const lt = document.getElementById('loadtext');
    if (lt) lt.textContent = '主模块加载失败';
  }
})();
</script>
</body>
</html>
