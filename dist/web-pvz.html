  /* ============ 子弹 ============ */
  class Projectile extends Entity {
    constructor(type, x, y, row, dmg) {
      super();
      this.type = type;   /* pea | snow | fire */
      this.x = x;
      this.y = y;
      this.row = row;
      this.dmg = dmg;
      this.speed = 330;
      this.passedTorch = false;
    }
    update(dt, board) {
      super.update(dt);
      this.x += this.speed * dt;
      if (this.x > G.W + 30) { this.dead = true; return; }
      /* 火炬树桩转换 */
      if (!this.passedTorch && this.type !== 'fire') {
        const torch = board.getPlantAtRowColByX(this.row, this.x - 12);
        if (torch && torch.type === 'torchwood') {
          this.type = 'fire';
          this.dmg = 40;
          this.passedTorch = true;
          board.spawnFireTrail(this.x, this.y);
        }
      }
      /* 命中检测：僵尸在前方 30px 内（防穿透容差） */
      let best = null;
      for (const z of board.zombies) {
        if (!z.alive || z.row !== this.row || z.vaultT > 0) continue;
        if (z.x >= this.x - 12 && z.x <= this.x + 30) {
          if (!best || z.x < best.x) best = z;
        }
      }
      if (best) {
        best.hit(this.dmg, {
          chill: this.type === 'snow' ? (PLANTS.snowpea.shoot.chill || 8) : 0,
          fire: this.type === 'fire',
        });
        board.spawnSplat(this.x + 6, this.y, this.type);
        A.S.splat();
        this.dead = true;
      }
    }
    draw(ctx) {
      SP.drawPea(ctx, this);
    }
  }

  /* ============ 阳光 ============ */
  class Sun extends Entity {
    constructor(x, y, value, from) {
      super();
      this.x = x;
      this.y = y;
      this.value = value;
      this.from = from;            /* sky | flower */
      this.r = 26;
      this.state = from === 'sky' ? 'falling' : 'pop';
      this.targetY = 0;
      this.vy = 0;
      this.life = 11;
      this.collecting = false;
      this.cx = 0; this.cy = 0;
      this.anim.t = U.rand(0, 10);
    }
    update(dt, board) {
      super.update(dt);
      if (this.collecting) {
        const tx = 70, ty = 44;
        this.x = U.lerp(this.x, tx, Math.min(1, dt * 9));
        this.y = U.lerp(this.y, ty, Math.min(1, dt * 9));
        if (Math.abs(this.x - tx) < 14 && Math.abs(this.y - ty) < 14) {
          this.dead = true;
          board.sun += this.value;
          board.floatText('+' + this.value, tx + 20, ty + 18, '#FFE060');
        }
        return;
      }
      if (this.state === 'falling') {
        this.y += 42 * dt;
        if (this.y >= this.targetY) this.state = 'idle';
      } else if (this.state === 'pop') {
        /* 从向日葵弹出的小抛物线 */
        this.vy += 260 * dt;
        this.y += this.vy * dt;
        if (this.y > this.targetY) { this.y = this.targetY; this.state = 'idle'; }
      } else {
        this.y += Math.sin(this.anim.t * 2.4) * 8 * dt;
      }
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    collect() {
      if (this.collecting || this.dead) return false;
      this.collecting = true;
      A.S.sun();
      return true;
    }
    draw(ctx) {
      const blink = this.life < 3 && Math.sin(this.anim.t * 12) < 0;
      if (!blink) SP.drawSun(ctx, this);
    }
  }

  /* ============ 割草机 ============ */
  class Mower extends Entity {
    constructor(row) {
      super();
      this.row = row;
      this.x = G.MOWER_X;
      this.y = G.GRID_Y + (row + 1) * G.CELL_H - 10;
      this.state = 'idle';
    }
    update(dt, board) {
      super.update(dt);
      if (this.state === 'running') {
        this.x += 340 * dt;
        /* 碾压僵尸 */
        for (const z of board.zombies) {
          if (z.alive && z.row === this.row && Math.abs(z.x - this.x) < 34) {
            z.instantKill(board);
            board.spawnMowerBits(z.x, z.y - 40);
          }
        }
        if (this.x % 3 < 1) board.spawnGrass(this.x - 10, this.y);
        if (this.x > G.W + 60) this.dead = true;
      }
    }
    trigger(board) {
      if (this.state !== 'idle') return;
      this.state = 'running';
      A.S.mower();
    }
    draw(ctx) {
      SP.drawMower(ctx, this);
    }
  }

  /* ============ 粒子 ============ */
  class Particle extends Entity {
    constructor(kind, x, y, opt = {}) {
      super();
      this.kind = kind;
      this.x = x; this.y = y;
      this.vx = opt.vx || 0;
      this.vy = opt.vy || 0;
      this.g = opt.g != null ? opt.g : 300;
      this.life = opt.life || 1;
      this.maxLife = this.life;
      this.color = opt.color || '#78C840';
      this.r = opt.r || 4;
      this.rot = opt.rot || 0;
      this.vr = opt.vr || 0;
      this.data = opt;
    }
    update(dt) {
      super.update(dt);
      this.life -= dt;
      if (this.life <= 0) { this.dead = true; return; }
      this.vy += this.g * dt;
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      this.rot += this.vr * dt;
      if (this.kind === 'ring') {
        this.r += 380 * dt;
        this.g = 0;
      }
    }
    draw(ctx) {
      const a = U.clamp(this.life / this.maxLife, 0, 1);
      ctx.save();
      ctx.translate(this.x, this.y);
      switch (this.kind) {
        case 'drop':
          ctx.globalAlpha = a;
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
          break;
        case 'ring':
          ctx.globalAlpha = a * 0.8;
          ctx.strokeStyle = this.color;
          ctx.lineWidth = 5 * a + 1;
          ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.stroke();
          break;
        case 'flash':
          ctx.globalAlpha = a;
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, this.r);
          g.addColorStop(0, this.color);
          g.addColorStop(1, 'rgba(255,200,60,0)');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(0, 0, this.r, 0, Math.PI * 2); ctx.fill();
          break;
        case 'smoke':
          ctx.globalAlpha = a * 0.5;
          ctx.fillStyle = this.color;
          ctx.beginPath(); ctx.arc(0, 0, this.r * (2 - a), 0, Math.PI * 2); ctx.fill();
          break;
        case 'flame': {
          ctx.globalAlpha = a;
          const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, this.r * 1.6);
          fg.addColorStop(0, '#FFE080');
          fg.addColorStop(0.5, '#FF8828');
          fg.addColorStop(1, 'rgba(230,60,10,0)');
          ctx.fillStyle = fg;
          ctx.beginPath(); ctx.arc(0, 0, this.r * 1.6, 0, Math.PI * 2); ctx.fill();
          break;
        }
        case 'zhead':
          ctx.rotate(this.rot);
          ctx.globalAlpha = Math.min(1, a * 2);
          SZ.PAL.normal && 0;
          ctx.scale(0.9, 0.9);
          /* 简化头颅 */
          const pal = this.data.chilled ? SZ.PAL.chilled : SZ.PAL.normal;
          ctx.fillStyle = pal.skin;
          ctx.beginPath(); ctx.ellipse(0, 0, 13, 14.5, 0, 0, Math.PI * 2); ctx.fill();
          ctx.strokeStyle = pal.skinLine;
          ctx.lineWidth = 1.2; ctx.stroke();
          ctx.fillStyle = '#3A4A28';
          ctx.beginPath();
          ctx.ellipse(3, -3, 3.4, 4, 0, 0, Math.PI * 2);
          ctx.ellipse(-6, -2, 2.6, 3, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#2A3218';
          ctx.beginPath(); ctx.ellipse(2, 7, 4.5, 3, 0, 0, Math.PI * 2); ctx.fill();
          break;
        case 'helm':
          ctx.rotate(this.rot);
          ctx.globalAlpha = Math.min(1, a * 2);
          if (this.data.htype === 'cone') {
            ctx.fillStyle = '#E88828';
            ctx.beginPath();
            ctx.moveTo(-12, 8); ctx.lineTo(0, -22); ctx.lineTo(12, 8);
            ctx.closePath(); ctx.fill();
          } else if (this.data.htype === 'bucket') {
            ctx.fillStyle = '#989CA2';
            ctx.fillRect(-13, -18, 26, 26);
            ctx.fillStyle = '#C8CCD0';
            ctx.fillRect(-13, -18, 26, 5);
          } else {
            ctx.fillStyle = '#D84848';
            ctx.beginPath(); ctx.ellipse(0, 0, 14, 12, 0, Math.PI, 0); ctx.closePath(); ctx.fill();
          }
          break;
        case 'grass':
          ctx.globalAlpha = a;
          ctx.fillStyle = this.color;
          ctx.rotate(this.rot);
          ctx.beginPath();
          ctx.ellipse(0, 0, this.r * 1.6, this.r * 0.5, 0, 0, Math.PI * 2);
          ctx.fill();
          break;
        case 'spark':
          ctx.globalAlpha = a;
          ctx.fillStyle = this.color;
          ctx.rotate(this.rot);
          ctx.beginPath();
          ctx.moveTo(0, -this.r);
          ctx.lineTo(this.r * 0.3, 0); ctx.lineTo(0, this.r); ctx.lineTo(-this.r * 0.3, 0);
          ctx.closePath(); ctx.fill();
          break;
      }
      ctx.restore();
    }
  }

  /* 浮动文字 */
  class FloatText extends Entity {
    constructor(str, x, y, color = '#fff') {
      super();
      this.str = str;
      this.x = x; this.y = y;
      this.color = color;
      this.life = 1.1;
    }
    update(dt) {
      super.update(dt);
      this.y -= 30 * dt;
      this.life -= dt;
      if (this.life <= 0) this.dead = true;
    }
    draw(ctx) {
      const a = U.clamp(this.life / 0.4, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      U.text(ctx, this.str, this.x, this.y, {
        size: 17, fill: this.color, stroke: 'rgba(0,0,0,0.7)', strokeW: 3,
      });
      ctx.restore();
    }
  }

  PVZ.Entity = Entity;
  PVZ.Plant = Plant;
  PVZ.Zombie = Zombie;
  PVZ.Projectile = Projectile;
  PVZ.Sun = Sun;
  PVZ.Mower = Mower;
  PVZ.Particle = Particle;
  PVZ.FloatText = FloatText;
})(window);

</script>
<script>
/* web-pvz — board.js
 * 棋盘：网格、波次系统、种植交互、割草机、胜负判定、战场渲染
 * 波次机制参考 PVZ-Godot-Dream（每 10 波大波 + 旗帜僵尸）与原版进度条
 */
(function (global) {
  'use strict';
  const PVZ = (global.PVZ = global.PVZ || {});
  const { U, G, PLANTS, ZOMBIES, waveBudget, isFlagWave } = PVZ;
  const { SP, SZ, A } = PVZ;

  class Board {
    constructor(game, levelDef, chosenPlants) {
      this.game = game;
      this.level = levelDef;
      this.chosen = chosenPlants.slice();
      this.sun = levelDef.startSun;

      this.plants = [];            /* 所有植物（含已死，过滤渲染） */
      this.grid = Array.from({ length: G.ROWS }, () => Array(G.COLS).fill(null));
      this.zombies = [];
      this.projectiles = [];
      this.suns = [];
      this.mowers = [];
      this.particles = [];
      this.texts = [];
      this.timers = [];            /* 延迟回调 {t, fn} */

      /* 卡片 */
      this.cards = this.chosen.map((type) => ({
        type, cd: 0, total: PLANTS[type].recharge,
      }));
      this.selected = -1;
      this.shovelMode = false;

      /* 波次 */
      this.totalWaves = levelDef.waves;
      this.wave = 0;
      this.waveAliveHp = 0;        /* 当前波剩余血量（用于推进度） */
      this.waveSpawned = false;
      this.waveTime = 0;
      this.firstWaveDelay = 22;
      this.spawnQueue = [];        /* {t, type, row} */
      this.banner = null;          /* {text, t, dur} */
      this.zombiesSpawnedTotal = 0;
      this.zombiesKilled = 0;

      /* 流程状态 */
      this.state = 'preview';      /* preview → ready → playing → win/lose */
      this.stateT = 0;
      this.readyStep = 0;
      this.gameSpeed = 1;
      this.loseT = 0;
      this.winT = 0;
      this.naturalSunT = U.rand(6, 9);
      this.ambienceT = 5;

      /* 割草机 */
      for (let r = 0; r < G.ROWS; r++) this.mowers.push(new PVZ.Mower(r));

      /* 选卡面板已在外部完成 */
      this.state = 'preview';
      this.showIntro();
    }

    showIntro() {
      const types = this.level.spawns.map((s) => ZOMBIES[s[0]].name).join('、');
      this.banner = { text: `${types}出现了！`, t: 0, dur: 2.6 };
    }

    delayed(t, fn) { this.timers.push({ t, fn }); }

    /* ============ 查询 ============ */
    plantAt(row, col) {
      if (row < 0 || row >= G.ROWS || col < 0 || col >= G.COLS) return null;
      return this.grid[row][col];
    }
    plantAtZombie(row, x) {
      /* 僵尸嘴部坐标 → 是否有植物 */
      const col = G.colAt(x);
      if (col < 0 || col >= G.COLS) return null;
      const p = this.grid[row][col];
      if (!p) return null;
      /* 接近格子中心才算咬到 */
      if (x < p.x + 30 && x > p.x - 42) return p;
      return null;
    }
    getPlantAtRowColByX(row, x) {
      const col = G.colAt(x);
      return this.plantAt(row, col);
    }
    zombieInRowAhead(row, x, ahead = 880) {
      let best = null;
      for (const z of this.zombies) {
        if (!z.alive || z.row !== row) continue;
        if (z.x > x && z.x < x + ahead) {
          if (!best || z.x < best.x) best = z;
        }
      }
      return best;
    }
    zombieNearRow(row, x, range) {
      for (const z of this.zombies) {
        if (!z.alive || z.row !== row) continue;
        if (Math.abs(z.x - x) < range) return z;
      }
      return null;
    }

    canPlantAt(row, col) {
      if (row < 0 || row >= G.ROWS || col < 0 || col >= G.COLS) return false;
      return this.grid[row][col] == null;
    }

    /* ============ 种植 / 铲除 ============ */
    tryPlant(row, col) {
      const card = this.cards[this.selected];
      if (!card) return false;
      const def = PLANTS[card.type];
      if (this.sun < def.cost || card.cd > 0) return false;
      if (!this.canPlantAt(row, col)) return false;
      const p = new PVZ.Plant(card.type, row, col);
      this.plants.push(p);
      this.grid[row][col] = p;
      this.sun -= def.cost;
      card.cd = card.total;
      this.selected = -1;
      A.S.plant();
      /* 种植尘土 */
      for (let i = 0; i < 8; i++) {
        this.particles.push(new PVZ.Particle('drop', p.x + U.rand(-24, 24), p.y - 6, {
          vx: U.rand(-60, 60), vy: U.rand(-140, -40), g: 420,
          color: '#8A6B4A', r: U.rand(2, 4), life: 0.5,
        }));
      }
      return true;
    }

    killPlant(p, reason) {
      if (p.dead) return;
      p.dead = true;
      if (this.grid[p.row][p.col] === p) this.grid[p.row][p.col] = null;
      if (reason === 'eaten') {
        for (let i = 0; i < 6; i++) {
          this.particles.push(new PVZ.Particle('drop', p.x + U.rand(-18, 18), p.y - 30, {
            vx: U.rand(-80, 80), vy: U.rand(-120, -30), g: 400,
            color: '#5A8A3A', r: U.rand(2, 3.5), life: 0.5,
          }));
        }
      } else {
        this.particles.push(new PVZ.Particle('smoke', p.x, p.y - 24, {
          vy: -40, g: 0, color: 'rgba(120,120,120,0.8)', r: 12, life: 0.6,
        }));
      }
    }

    shovelAt(row, col) {
      const p = this.plantAt(row, col);
      if (!p) return false;
      this.killPlant(p, 'shovel');
      A.S.shovel();
      return true;
    }

    /* ============ 阳光 ============ */
    spawnSunAt(x, y, value, from) {
      const s = new PVZ.Sun(x, y, value, from);
      if (from === 'sky') {
        s.targetY = G.GRID_Y + U.rand(60, G.GRID_H - 60);
      } else {
        s.targetY = Math.min(G.GRID_Y + G.GRID_H - 30, y + 52);
        s.vy = -120;
      }
      this.suns.push(s);
      return s;
    }

    collectSunAt(x, y) {
      /* 后绘制的优先（数组尾部） */
      for (let i = this.suns.length - 1; i >= 0; i--) {
        const s = this.suns[i];
        if (s.dead || s.collecting) continue;
        if (U.dist2(x, y, s.x, s.y) < 38 * 38) {
          s.collect();
          return true;
        }
      }
      return false;
    }

    /* ============ 爆炸类攻击 ============ */
    explode(x, row, radius, dmg, kind) {
      A.S.explode();
      this.particles.push(new PVZ.Particle('flash', x, G.cellCenterY(row), {
        g: 0, r: radius * 0.9, life: 0.35, color: kind === 'potato' ? 'rgba(255,240,150,0.95)' : 'rgba(255,200,80,0.95)',
      }));
      this.particles.push(new PVZ.Particle('ring', x, G.cellCenterY(row), {
        g: 0, r: 20, life: 0.5, color: 'rgba(255,160,60,0.9)',
      }));
      for (let i = 0; i < 14; i++) {
        this.particles.push(new PVZ.Particle('smoke', x + U.rand(-radius * 0.5, radius * 0.5), G.cellCenterY(row) + U.rand(-30, 30), {
          vy: U.rand(-90, -20), vx: U.rand(-50, 50), g: -30,
          color: 'rgba(90,80,70,0.9)', r: U.rand(10, 18), life: U.rand(0.6, 1.1),
        }));
      }
      for (const z of this.zombies) {
        if (!z.alive) continue;
        const dx = Math.abs(z.x - x);
        const dy = Math.abs(z.row - row) * G.CELL_H * 0.8;
        if (dx * 0.6 + dy < radius) {
          z.hit(dmg, { fire: true });
        }
      }
      if (kind === 'squash') {
        this.particles.push(new PVZ.Particle('ring', x, G.cellCenterY(row) - 20, {
          g: 0, r: 10, life: 0.4, color: 'rgba(200,240,140,0.9)',
        }));
      }
    }

    fireRow(row, dmg) {
      A.S.explode();
      A.S.rip();
      for (let i = 0; i < 26; i++) {
        this.particles.push(new PVZ.Particle('flame', G.GRID_X + U.rand(0, G.GRID_W), G.cellCenterY(row) + U.rand(-40, 30), {
          vy: U.rand(-120, -40), vx: U.rand(-20, 20), g: -60,
          r: U.rand(10, 22), life: U.rand(0.4, 0.9),
        }));
      }
      for (const z of this.zombies) {
        if (!z.alive || z.row !== row) continue;
        z.hit(dmg, { fire: true });
      }
      /* 地面焦痕 */
      this.particles.push(new PVZ.Particle('smoke', G.GRID_X + G.GRID_W / 2, G.cellCenterY(row), {
        g: 0, r: 60, life: 1.4, color: 'rgba(60,40,30,0.4)', vy: -6,
      }));
    }

    /* ============ 粒子辅助 ============ */
    spawnSplat(x, y, type) {
      const color = type === 'snow' ? '#A8DCF8' : type === 'fire' ? '#FF8828' : '#78C840';
      for (let i = 0; i < 5; i++) {
        this.particles.push(new PVZ.Particle('drop', x, y + U.rand(-6, 6), {
          vx: U.rand(-90, -20), vy: U.rand(-120, -20), g: 420,
          color, r: U.rand(1.8, 3.4), life: 0.4,
        }));
      }
    }
    spawnFireTrail(x, y) {
      this.particles.push(new PVZ.Particle('flame', x, y, {
        vx: 60, vy: U.rand(-30, 30), g: -40, r: 10, life: 0.3,
      }));
    }
    spawnHeadFall(x, y, chilled) {
      this.particles.push(new PVZ.Particle('zhead', x, y, {
        vx: U.rand(-30, 50), vy: -180, g: 500, vr: U.rand(2, 5),
        life: 1.4, chilled,
      }));
    }
    spawnHelmFall(type, x, y) {
      this.particles.push(new PVZ.Particle('helm', x, y, {
        vx: U.rand(40, 90), vy: -160, g: 520, vr: U.rand(3, 6),
        life: 1.1, htype: type,
      }));
    }
    spawnMowerBits(x, y) {
      for (let i = 0; i < 6; i++) {
        this.particles.push(new PVZ.Particle('drop', x + U.rand(-10, 10), y + U.rand(-20, 20), {
          vx: U.rand(-120, 120), vy: U.rand(-260, -80), g: 500,
          color: '#8A9A5A', r: U.rand(2, 4), life: 0.7,
        }));
      }
    }
    spawnGrass(x, y) {
      if (this.particles.length > 240) return;
      this.particles.push(new PVZ.Particle('grass', x, y - 6, {
        vx: U.rand(-70, -10), vy: U.rand(-150, -60), g: 480,
        color: U.pick(['#5FA83A', '#6FBF44']), r: U.rand(2, 3.5), life: 0.5, vr: U.rand(-8, 8),
      }));
    }
    floatText(str, x, y, color) {
      this.texts.push(new PVZ.FloatText(str, x, y, color));
    }

    /* ============ 波次系统 ============ */
    startWave() {
      this.wave++;
      this.waveTime = 0;
      this.waveSpawned = false;
      const flag = isFlagWave(this.wave, 10);
      const isFinal = this.wave === this.totalWaves;
      const budget = waveBudget(this.wave, 10);

      if (isFinal) {
        this.banner = { text: '最后一波！', t: 0, dur: 2.2 };
        A.S.rise();
      } else if (flag) {
        this.banner = { text: '一大波僵尸正在接近！', t: 0, dur: 2.4 };
        A.S.rise();
      }

      /* 生成出怪队列 */
      const items = [];
      let spent = 0;
      const pool = this.level.spawns.map(([type, w]) => ({ type, w }));
      let guard = 0;
      while (spent < budget && guard++ < 60) {
        const it = U.weighted(pool);
        items.push(it.type);
        spent += ZOMBIES[it.type].value;
      }
      /* 大波前置旗帜僵尸 */
      if (flag || isFinal) items.unshift('flag');

      const baseDelay = flag || isFinal ? 2.5 : 0.5;
      items.forEach((type, i) => {
        this.spawnQueue.push({
          t: baseDelay + (flag || isFinal ? i * U.rand(0.25, 0.6) : i * U.rand(0.4, 1.2)),
          type,
          row: U.randInt(0, G.ROWS - 1),
        });
      });
      this.waveAliveHp = 0;
    }

    onZombieDeath(z) {
      this.zombiesKilled++;
    }

    waveCleared() {
      /* 当前波僵尸（含队列未出）全部死亡 */
      if (this.spawnQueue.length > 0) return false;
      for (const z of this.zombies) {
        if (z.row != null && !z.dead) {
          if (z.alive || z.anim.dying) return false;
        }
      }
      return true;
    }

    /* ============ 失败/胜利 ============ */
    zombieReachedHouse(z) {
      const mower = this.mowers.find((m) => m.row === z.row && m.state === 'idle' && !m.dead);
      if (mower) {
        mower.trigger(this);
      } else if (z.x < G.HOUSE_X && this.state === 'playing') {
        this.state = 'lose';
        this.stateT = 0;
        A.stopMusic();
        A.S.lose();
      }
    }

    checkWin() {
      if (this.state !== 'playing') return;
      if (this.totalWaves !== Infinity && this.wave >= this.totalWaves && this.waveCleared()) {
        this.state = 'win';
        this.stateT = 0;
        A.stopMusic();
        A.S.win();
        this.game.onLevelWin(this.level);
      }
    }

    /* ============ 更新 ============ */
    update(dt) {
      /* 横幅计时（各状态通用） */
      if (this.banner) {
        this.banner.t += dt;
        if (this.banner.t > this.banner.dur) this.banner = null;
      }

      /* 延迟回调 */
      for (const tm of this.timers) tm.t -= dt;
      this.timers = this.timers.filter((tm) => {
        if (tm.t <= 0) { tm.fn(); return false; }
        return true;
      });

      if (this.state === 'preview') {
        this.stateT += dt;
        if (this.stateT > 2.8) {
          this.state = 'ready';
          this.stateT = 0;
          this.readyStep = 0;
        }
        return;
      }
      if (this.state === 'ready') {
        this.stateT += dt;
        const step = Math.floor(this.stateT / 0.8);
        if (step !== this.readyStep) {
          this.readyStep = step;
          A.S.click();
        }
        if (this.stateT > 2.4) {
          this.state = 'playing';
          this.banner = null;
          A.playMusic('day');
        }
        return;
      }
      if (this.state === 'win' || this.state === 'lose') {
        this.stateT += dt;
        if (this.state === 'lose') {
          /* 脑子被吃演出 */
          if (this.stateT > 0.5 && this.stateT % 0.6 < dt * 2) A.S.eat();
        }
      }

      const gdt = this.state === 'win' || this.state === 'lose' ? dt * 0.3 : dt;

      /* 卡片冷却 */
      for (const c of this.cards) c.cd = Math.max(0, c.cd - gdt);

      /* 自然阳光 */
      if (this.state === 'playing') {
        this.naturalSunT -= gdt;
        if (this.naturalSunT <= 0) {
          this.naturalSunT = U.rand(8.5, 10.5);
          this.spawnSunAt(G.GRID_X + U.rand(40, G.GRID_W - 40), -30, 25, 'sky');
        }
        /* 鸟鸣氛围 */
        this.ambienceT -= gdt;
        if (this.ambienceT <= 0) {
          this.ambienceT = U.rand(7, 15);
          A.S.ambience();
        }
      }

      /* 波次调度 */
      if (this.state === 'playing') {
        this.waveTime += gdt;
        if (this.wave === 0) {
          if (this.waveTime > this.firstWaveDelay) this.startWave();
        } else {
          const timeout = this.waveTime > 32;
          const mostlyDead = this.waveKillRatio() > 0.7;
          const allDead = this.waveCleared();
          if (this.wave < this.totalWaves && (allDead || mostlyDead || timeout)) {
            this.startWave();
          }
        }
        /* 出怪队列 */
        for (const s of this.spawnQueue) s.t -= gdt;
        const toSpawn = this.spawnQueue.filter((s) => s.t <= 0);
        this.spawnQueue = this.spawnQueue.filter((s) => s.t > 0);
        for (const s of toSpawn) {
          const z = new PVZ.Zombie(s.type, s.row, this);
          this.zombies.push(z);
          this.zombiesSpawnedTotal++;
          this.waveAliveHp += z.bodyHp + z.helmHp + z.shieldHp;
          if (Math.random() < 0.3) A.S.groan();
        }
        this.checkWin();
      }

      /* 实体更新 */
      for (const p of this.plants) if (!p.dead) p.update(gdt, this);
      for (const z of this.zombies) z.update(gdt, this);
      for (const pr of this.projectiles) pr.update(gdt, this);
      for (const s of this.suns) s.update(gdt, this);
      for (const m of this.mowers) m.update(gdt, this);
      for (const pt of this.particles) pt.update(gdt);
      for (const tx of this.texts) tx.update(gdt);

      /* 清理 */
      this.plants = this.plants.filter((p) => !p.dead);
      this.zombies = this.zombies.filter((z) => !z.dead);
      this.projectiles = this.projectiles.filter((p) => !p.dead);
      this.suns = this.suns.filter((s) => !s.dead);
      this.mowers = this.mowers.filter((m) => !m.dead);
      this.particles = this.particles.filter((p) => !p.dead);
      this.texts = this.texts.filter((t) => !t.dead);
    }

    waveKillRatio() {
      /* 当前波未出完时不计进度（防止连续触发） */
      if (this.spawnQueue.length > 0) return 0;
      if (this.waveAliveHp <= 0) return 1;
      let hp = 0;
      for (const z of this.zombies) {
        if (!z.dead && z.row != null) hp += z.alive ? (z.bodyHp + z.helmHp + z.shieldHp) : 0;
      }
      return 1 - U.clamp(hp / this.waveAliveHp, 0, 1);
    }

    progress() {
      if (this.totalWaves === Infinity) {
        return Math.min(1, this.wave / 40);
      }
      return U.clamp(this.wave / this.totalWaves, 0, 1);
    }

    /* ============ 渲染 ============ */
    draw(ctx) {
      /* 背景 */
      SP.drawBackground(ctx);

      /* 悬停格子高亮 */
      if (this.hoverCell && (this.selected >= 0 || this.shovelMode) && this.state === 'playing') {
        const { row, col } = this.hoverCell;
        if (row >= 0 && row < G.ROWS && col >= 0 && col < G.COLS) {
          ctx.save();
          if (this.selected >= 0) {
            ctx.fillStyle = this.canPlantAt(row, col) ? 'rgba(255,255,180,0.28)' : 'rgba(255,80,80,0.25)';
          } else {
            ctx.fillStyle = this.plantAt(row, col) ? 'rgba(255,255,180,0.3)' : 'rgba(200,200,200,0.12)';
          }
          ctx.fillRect(G.GRID_X + col * G.CELL_W, G.GRID_Y + row * G.CELL_H, G.CELL_W, G.CELL_H);
          ctx.strokeStyle = 'rgba(255,255,255,0.5)';
          ctx.lineWidth = 2;
          ctx.strokeRect(G.GRID_X + col * G.CELL_W + 1, G.GRID_Y + row * G.CELL_H + 1, G.CELL_W - 2, G.CELL_H - 2);
          ctx.restore();
        }
      }

      /* 按行排序绘制（上行先画，保证遮挡） */
      const byRow = (a, b) => a.row - b.row || a.y - b.y;

      /* 割草机 */
      for (const m of this.mowers) m.draw(ctx);

      /* 植物 + 僵尸按行交织 */
      const drawables = [];
      for (const p of this.plants) drawables.push(p);
      for (const z of this.zombies) drawables.push(z);
      drawables.sort(byRow);
      for (const d of drawables) d.draw(ctx);

      /* 子弹 */
      for (const pr of this.projectiles) pr.draw(ctx);

      /* 粒子 */
      for (const pt of this.particles) pt.draw(ctx);

      /* 阳光（最上层，方便点击） */
      for (const s of this.suns) s.draw(ctx);

      /* 浮动文字 */
      for (const t of this.texts) t.draw(ctx);

      /* 种植预览幽灵 */
      if (this.selected >= 0 && this.hoverCell && this.hoverCell.col < G.COLS && this.hoverCell.col >= 0) {
        const { row, col } = this.hoverCell;
        if (row >= 0 && row < G.ROWS && this.canPlantAt(row, col)) {
          ctx.save();
          ctx.globalAlpha = 0.55;
          ctx.translate(G.cellCenterX(col), G.GRID_Y + (row + 1) * G.CELL_H - 8);
          const ghost = { anim: { t: 0 }, seed: 1, hp: 1, maxHp: 1, armed: true };
          SP.plant(ctx, this.cards[this.selected].type, ghost);
          ctx.restore();
        }
      }

      /* UI：种子栏 / 阳光数 / 铲子 / 进度条 / 横幅 */
      this.drawHUD(ctx);

      /* Ready-Set-Plant */
      if (this.state === 'ready') {
        const labels = ['准备……', '安放……', '种植！'];
        const step = Math.min(2, Math.floor(this.stateT / 0.8));
        const p = (this.stateT % 0.8) / 0.8;
        ctx.save();
        ctx.globalAlpha = 1 - Math.max(0, p - 0.75) * 4;
        const scale = 1 + p * 0.25;
        ctx.translate(G.W / 2, G.H / 2 - 40);
        ctx.scale(scale, scale);
        U.text(ctx, labels[step], 0, 0, {
          size: 52, fill: step === 2 ? '#FFE060' : '#FFFFFF',
          stroke: '#3A2A10', strokeW: 8,
        });
        ctx.restore();
      }

      /* 失败演出 */
      if (this.state === 'lose') {
        ctx.save();
        const a = U.clamp(this.stateT / 1.2, 0, 1);
        ctx.fillStyle = `rgba(20,0,0,${a * 0.75})`;
        ctx.fillRect(0, 0, G.W, G.H);
        if (this.stateT > 0.8) {
          const shake = Math.sin(this.stateT * 30) * 3 * (1 - U.clamp((this.stateT - 0.8) / 2, 0, 1));
          ctx.translate(shake, 0);
          U.text(ctx, '僵尸吃掉了你的脑子！', G.W / 2, G.H / 2 - 30, {
            size: 46, fill: '#D82818', stroke: '#2A0000', strokeW: 8,
          });
        }
        ctx.restore();
      }
    }

    drawHUD(ctx) {
      /* —— 种子栏木框（宽度随卡数自适应） —— */
      const cw = 56, chh = G.BANK_H - 22;
      const bankW = Math.min(G.W - 200, 88 + this.cards.length * (cw + 5) + 62);
      ctx.save();
      const g = ctx.createLinearGradient(0, 0, 0, G.BANK_H);
      g.addColorStop(0, '#B08A50');
      g.addColorStop(1, '#8A6238');
      ctx.fillStyle = g;
      U.rr(ctx, 6, 5, bankW, G.BANK_H - 10, 10);
      ctx.fill();
      ctx.strokeStyle = '#5A3A1A';
      ctx.lineWidth = 2;
      U.rr(ctx, 6, 5, bankW, G.BANK_H - 10, 10);
      ctx.stroke();

      /* 阳光计数区 */
      ctx.fillStyle = '#F8E8B8';
      U.rr(ctx, 14, 12, 64, G.BANK_H - 24, 8);
      ctx.fill();
      ctx.strokeStyle = '#B09050';
      ctx.lineWidth = 1.5;
      U.rr(ctx, 14, 12, 64, G.BANK_H - 24, 8);
      ctx.stroke();
      SP.sunIcon(ctx, 46, 38, 16);
      U.text(ctx, String(Math.floor(this.sun)), 46, 66, { size: 16, fill: '#2A2A2A' });

      /* 卡片 */
      for (let i = 0; i < this.cards.length; i++) {
        const c = this.cards[i];
        const x = 88 + i * (cw + 5), y = 11;
        SP.drawCard(ctx, c.type, x, y, cw, chh, {
          selected: this.selected === i,
          cooldown: c.cd / c.total,
          disabled: this.sun < PLANTS[c.type].cost,
        });
      }

      /* 铲子槽 */
      const sx = 88 + this.cards.length * (cw + 5) + 8;
      {
        ctx.fillStyle = this.shovelMode ? '#F8E8B0' : '#9A7444';
        U.rr(ctx, sx, 11, 50, chh, 8);
        ctx.fill();
        ctx.strokeStyle = this.shovelMode ? '#FFE090' : '#5A3A1A';
        ctx.lineWidth = 2;
        U.rr(ctx, sx, 11, 50, chh, 8);
        ctx.stroke();
        SP.drawShovel(ctx, sx + 25, 44, 0.85, this.shovelMode ? -0.5 : 0.2);
      }
      ctx.restore();

      /* —— 顶部右侧按钮 —— */
      this.game.drawTopButtons(ctx);

      /* —— 波次进度条 —— */
      if (this.totalWaves !== Infinity) {
        const bw = 210, bh = 18;
        const bx = G.W - bw - 18, by = G.H - 26;
        ctx.save();
        ctx.fillStyle = 'rgba(60,40,20,0.75)';
        U.rr(ctx, bx - 4, by - 4, bw + 8, bh + 8, 9);
        ctx.fill();
        const g2 = ctx.createLinearGradient(0, by, 0, by + bh);
        g2.addColorStop(0, '#4A8A2E');
        g2.addColorStop(1, '#7ABF4E');
        ctx.fillStyle = g2;
        U.rr(ctx, bx, by, bw * this.progress(), bh, 7);
        ctx.fill();
        ctx.strokeStyle = '#2A4A18';
        ctx.lineWidth = 1.5;
        U.rr(ctx, bx, by, bw, bh, 7);
        ctx.stroke();
        /* 旗帜节点 */
        const flags = Math.floor(this.totalWaves / 10);
        for (let i = 1; i <= flags; i++) {
          SP.flagIcon(ctx, bx + bw * (i * 10 / this.totalWaves), by - 2, 0.9);
        }
        /* 僵尸头标记 */
        const prog = this.progress();
        SP.zombieHeadIcon(ctx, bx + bw * prog, by + bh / 2, 1);
        U.text(ctx, `第 ${Math.min(this.wave + (this.waveCleared() ? 0 : 1), this.totalWaves)}/${this.totalWaves} 波`, bx + bw / 2, by - 16, {
          size: 13, fill: '#F0E8C8', stroke: 'rgba(0,0,0,0.6)', strokeW: 3,
        });
        ctx.restore();
      } else {
        /* 无尽模式波数 */
        U.text(ctx, `第 ${this.wave} 波 · 击杀 ${this.zombiesKilled}`, G.W - 100, G.H - 18, {
          size: 15, fill: '#F0E8C8', stroke: 'rgba(0,0,0,0.6)', strokeW: 3,
        });
      }

      /* —— 横幅 —— */
      if (this.banner) {
        const b = this.banner;
        const p = b.t / b.dur;
        let a = 1;
        if (p < 0.12) a = p / 0.12;
        else if (p > 0.85) a = (1 - p) / 0.15;
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(40,20,10,0.55)';
        ctx.fillRect(0, G.H / 2 - 52, G.W, 74);
        const shake = Math.sin(b.t * 18) * 2 * (p < 0.3 ? 1 : 0.3);
        ctx.translate(shake, 0);
        U.text(ctx, b.text, G.W / 2, G.H / 2 - 15, {
          size: 38, fill: '#E83020', stroke: '#FFF0D0', strokeW: 7,
        });
        ctx.restore();
      }
    }
  }

  PVZ.Board = Board;
})(window);

</script>
<script>
/* web-pvz — scenes.js
 * 场景管理：标题、选关、选卡、游戏（含暂停/胜负面板）、图鉴、设置
 */
(function (global) {
  'use strict';
  const PVZ = (global.PVZ = global.PVZ || {});
  const { U, G, PLANTS, ZOMBIES, LEVELS } = PVZ;
  const { SP, SZ, A } = PVZ;

  /* ============ 按钮组件 ============ */
  let _btnId = 0;
  class Button {
    constructor(x, y, w, h, label, opt = {}) {
      this.id = _btnId++;
      this.x = x; this.y = y; this.w = w; this.h = h;
      this.label = label;
      this.opt = opt;
      this.hover = false;
      this.disabled = opt.disabled || false;
      this.onClick = opt.onClick || (() => {});
    }
    contains(px, py) {
      return px >= this.x && px <= this.x + this.w && py >= this.y && py <= this.y + this.h;
    }
    handle(p) {
      if (p.type === 'pointermove') {
        const h = this.contains(p.x, p.y) && !this.disabled;
        if (h && !this.hover) A.S.hover();
        this.hover = h;
      } else if (p.type === 'pointerdown' && this.contains(p.x, p.y)) {
        A.S.click();
        this.onClick(this);
        return true;
      }
      return false;
    }
    draw(ctx) {
      ctx.save();
      const h = this.hover && !this.disabled;
      const g = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
      if (this.disabled) {
        g.addColorStop(0, '#9A9A9A'); g.addColorStop(1, '#7A7A7A');
      } else if (h) {
        g.addColorStop(0, this.opt.hoverTop || '#FFE9A0');
        g.addColorStop(1, this.opt.hoverBottom || '#E8B040');
      } else {
        g.addColorStop(0, this.opt.top || '#F8D878');
        g.addColorStop(1, this.opt.bottom || '#C89828');
      }
      ctx.fillStyle = g;
      U.rr(ctx, this.x, this.y, this.w, this.h, 10);
      ctx.fill();
      ctx.strokeStyle = this.disabled ? '#5A5A5A' : '#8A6818';
      ctx.lineWidth = 2.5;
      U.rr(ctx, this.x, this.y, this.w, this.h, 10);
      ctx.stroke();
      /* 高光 */
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      U.rr(ctx, this.x + 4, this.y + 3, this.w - 8, this.h * 0.35, 8);
      ctx.fill();
      U.text(ctx, this.label, this.x + this.w / 2, this.y + this.h / 2 + 1, {
        size: this.opt.size || 18,
        fill: this.disabled ? '#C8C8C8' : (this.opt.color || '#5A3A10'),
      });
      ctx.restore();
    }
  }

  /* ============ 场景基类 ============ */
  class Scene {
    constructor(game) {
      this.game = game;
      this.buttons = [];
      this.t = 0;
    }
    update(dt) { this.t += dt; }
    draw(ctx) {}
    handlePointer(p) {
      for (const b of this.buttons) if (b.handle(p)) return true;
      return false;
    }
  }

  /* ============ 标题场景 ============ */
  class TitleScene extends Scene {
    constructor(game) {
      super(game);
      const cx = G.W / 2;
      this.buttons = [
        new Button(cx - 110, 300, 220, 52, '冒 险 模 式', {
          size: 22,
          onClick: () => game.goto(new LevelSelectScene(game)),
        }),
        new Button(cx - 110, 366, 220, 52, game.save.endlessUnlocked ? '无 尽 模 式' : '无尽模式（未解锁）', {
          size: game.save.endlessUnlocked ? 22 : 17, disabled: !game.save.endlessUnlocked,
          onClick: () => {
            if (game.save.endlessUnlocked) game.startLevel(LEVELS.find((l) => l.id === 'endless'));
          },
        }),
        new Button(cx - 110, 432, 220, 52, '植 物 图 鉴', {
          size: 22,
          onClick: () => game.goto(new AlmanacScene(game)),
        }),
        new Button(cx - 110, 498, 220, 52, '设 置', {
          size: 22,
          onClick: () => game.goto(new SettingsScene(game)),
        }),
      ];
      A.playMusic('menu');
    }
    draw(ctx) {
      /* 背景 */
      SP.drawBackground(ctx);
      /* 装饰：两侧植物与僵尸剪影 */
      ctx.save();
      ctx.translate(140, 520);
      ctx.scale(1.4, 1.4);
      const deco = { anim: { t: this.t }, seed: 2, hp: 1, maxHp: 1, armed: true };
      SP.plant(ctx, 'sunflower', deco);
      ctx.restore();
      ctx.save();
      ctx.translate(300, 520);
      ctx.scale(1.4, 1.4);
      SP.plant(ctx, 'peashooter', deco);
      ctx.restore();
      ctx.save();
      ctx.translate(700, 520);
      ctx.scale(1.35, 1.35);
      const zDeco = {
        type: 'normal', chill: 0, helmHp: 0, shieldHp: 0,
        anim: { t: this.t, eating: false, dying: false, walkRate: 2.4 },
      };
      SZ.draw(ctx, zDeco);
      ctx.restore();
      ctx.save();
      ctx.translate(840, 520);
      ctx.scale(1.35, 1.35);
      const zDeco2 = {
        type: 'cone', chill: 0, helmHp: 370, shieldHp: 0,
        anim: { t: this.t + 2, eating: false, dying: false, walkRate: 2.2 },
      };
      SZ.draw(ctx, zDeco2);
      ctx.restore();

      /* 标题 */
      ctx.save();
      const cx = G.W / 2;
      const bounce = Math.sin(this.t * 1.8) * 6;
      ctx.translate(cx, 130 + bounce);
      ctx.rotate(-0.02);
      U.text(ctx, '植物大战僵尸', 0, 0, {
        size: 72, fill: '#FFE060', stroke: '#3A5A10', strokeW: 12,
      });
      U.text(ctx, 'WEB EDITION', 0, 52, {
        size: 26, fill: '#FFFFFF', stroke: '#3A5A10', strokeW: 6,
      });
      ctx.restore();

      /* 太阳装饰 */
      ctx.save();
      ctx.translate(G.W - 90, 80);
      ctx.scale(1.6, 1.6);
      SP.drawSun(ctx, { x: 0, y: 0, r: 24, anim: { t: this.t } });
      ctx.restore();

      for (const b of this.buttons) b.draw(ctx);

      U.text(ctx, '机制参考 PvZ-Portable · 数值取自 PVZ-Godot-Dream · 全程序化绘制', cx, G.H - 16, {
        size: 12, fill: 'rgba(255,255,255,0.85)', stroke: 'rgba(0,0,0,0.4)', strokeW: 3,
      });
    }
  }

  /* ============ 选关场景 ============ */
  class LevelSelectScene extends Scene {
    constructor(game) {
      super(game);
      const cx = G.W / 2;
      this.buttons = [
        new Button(24, 20, 100, 44, '← 返回', { onClick: () => game.goto(new TitleScene(game)) }),
      ];
      /* 关卡卡片 */
      this.levelCards = [];
      const cardW = 160, cardH = 190, gap = 18;
      const count = 5;
      const totalW = count * cardW + (count - 1) * gap;
      const x0 = cx - totalW / 2;
      LEVELS.filter((l) => l.id !== 'endless').forEach((lv, i) => {
        const x = x0 + i * (cardW + gap), y = 140;
        const unlocked = game.save.unlocked >= lv.id;
        this.levelCards.push({ lv, x, y, w: cardW, h: cardH, unlocked });
        this.buttons.push(new Button(x, y, cardW, cardH, '', {
          top: unlocked ? '#A8D878' : '#9A9A9A',
          bottom: unlocked ? '#5A9838' : '#6E6E6E',
          hoverTop: '#C8EC9A', hoverBottom: '#78B448',
          disabled: !unlocked,
          onClick: () => game.goto(new SeedSelectScene(game, lv)),
        }));
      });
      /* 无尽卡片（下方） */
      this.endlessCard = {
        x: cx - 130, y: 360, w: 260, h: 90,
        unlocked: game.save.endlessUnlocked,
      };
      this.buttons.push(new Button(cx - 130, 360, 260, 90, this.endlessCard.unlocked ? '无 尽 模 式' : '🔒 通关第 5 关解锁', {
        size: 24,
        top: this.endlessCard.unlocked ? '#D89028' : '#9A9A9A',
        bottom: this.endlessCard.unlocked ? '#A05808' : '#6E6E6E',
        disabled: !this.endlessCard.unlocked,
        onClick: () => {
          const lv = LEVELS.find((l) => l.id === 'endless');
          game.goto(new SeedSelectScene(game, lv));
        },
      }));
      this.bestWave = U.load('bestWave', 0);
    }
    draw(ctx) {
      SP.drawBackground(ctx);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, 0, G.W, G.H);
      U.text(ctx, '选择关卡', G.W / 2, 70, {
        size: 40, fill: '#FFE060', stroke: '#3A2A10', strokeW: 7,
      });

      for (const b of this.buttons) b.draw(ctx);

      /* 关卡卡片内容 */
      for (const c of this.levelCards) {
        const { x, y, w, h, lv, unlocked } = c;
        U.text(ctx, lv.name, x + w / 2, y + 34, {
          size: 24, fill: unlocked ? '#2A3A10' : '#B8B8B8',
        });
        U.text(ctx, `${lv.waves} 波僵尸`, x + w / 2, y + 70, { size: 15, fill: '#3A3A3A' });
        U.text(ctx, `${lv.plants.length} 种植物可选`, x + w / 2, y + 94, { size: 15, fill: '#3A3A3A' });
        U.text(ctx, unlocked ? lv.intro.slice(0, 11) : '尚未解锁', x + w / 2, y + 130, {
          size: 13, fill: unlocked ? '#5A5A5A' : '#989898',
        });
        if (!unlocked) {
          ctx.save();
          ctx.globalAlpha = 0.7;
          U.text(ctx, '🔒', x + w / 2, y + 158, { size: 26 });
          ctx.restore();
        } else if (this.game.save.cleared >= lv.id) {
          U.text(ctx, '★ 已通关', x + w / 2, y + 160, { size: 15, fill: '#B88018' });
        }
      }
      if (this.endlessCard.unlocked && this.bestWave > 0) {
        U.text(ctx, `最高纪录：第 ${this.bestWave} 波`, G.W / 2, 478, {
          size: 16, fill: '#F0E8C8', stroke: 'rgba(0,0,0,0.5)', strokeW: 4,
        });
      }
      U.text(ctx, '通关任意关卡后进度自动保存（localStorage）', G.W / 2, G.H - 20, {
        size: 13, fill: 'rgba(255,255,255,0.8)', stroke: 'rgba(0,0,0,0.4)', strokeW: 3,
      });
    }
  }

  /* ============ 选卡场景 ============ */
  class SeedSelectScene extends Scene {
    constructor(game, level) {
      super(game);
      this.level = level;
      this.maxSlots = Math.min(level.slots, level.plants.length);
      this.picked = level.plants.slice(0, this.maxSlots); /* 默认全选 */
      this.cards = level.plants.map((t) => ({ type: t }));
      this.layout();
      A.playMusic('menu');
    }
    layout() {
      const cols = 7;
      const cw = 92, chh = 118, gap = 12;
      const totalW = cols * cw + (cols - 1) * gap;
      const x0 = G.W / 2 - totalW / 2, y0 = 160;
      this.cards.forEach((c, i) => {
        c.x = x0 + (i % cols) * (cw + gap);
        c.y = y0 + Math.floor(i / cols) * (chh + gap);
        c.w = cw; c.h = chh;
      });
      this.buttons = [
        new Button(G.W / 2 - 180, G.H - 74, 160, 50, '← 返回', {
          onClick: () => this.game.goto(new LevelSelectScene(this.game)),
        }),
        new Button(G.W / 2 + 20, G.H - 74, 160, 50, `开 始 战 斗`, {
          size: 20,
          onClick: () => this.game.startLevel(this.level, this.picked),
        }),
      ];
    }
    handlePointer(p) {
      for (const b of this.buttons) if (b.handle(p)) return true;
      if (p.type === 'pointerdown') {
        for (const c of this.cards) {
          if (p.x >= c.x && p.x <= c.x + c.w && p.y >= c.y && p.y <= c.y + c.h) {
            const idx = this.picked.indexOf(c.type);
            if (idx >= 0) {
              if (this.picked.length > 1) this.picked.splice(idx, 1);
            } else {
              this.picked.push(c.type);
            }
            A.S.click();
            return true;
          }
        }
      }
      return false;
    }
    draw(ctx) {
      SP.drawBackground(ctx);
      ctx.fillStyle = 'rgba(20,30,15,0.55)';
      ctx.fillRect(0, 0, G.W, G.H);

      U.text(ctx, `${this.level.name} — 选择植物`, G.W / 2, 60, {
        size: 34, fill: '#FFE060', stroke: '#3A2A10', strokeW: 6,
      });
      U.text(ctx, `${this.level.intro}`, G.W / 2, 100, {
        size: 16, fill: '#F0E8D0', stroke: 'rgba(0,0,0,0.5)', strokeW: 4,
      });
      U.text(ctx, `已选 ${this.picked.length} / ${this.maxSlots}（至少选 1 种）`, G.W / 2, 130, {
        size: 15, fill: '#C8E8A0', stroke: 'rgba(0,0,0,0.5)', strokeW: 4,
      });

      /* 卡片 */
      for (const c of this.cards) {
        const picked = this.picked.includes(c.type);
        ctx.save();
        ctx.fillStyle = picked ? 'rgba(250,240,200,0.95)' : 'rgba(120,118,100,0.55)';
        U.rr(ctx, c.x, c.y, c.w, c.h, 10);
        ctx.fill();
        ctx.strokeStyle = picked ? '#B89040' : 'rgba(80,80,70,0.8)';
        ctx.lineWidth = 2.5;
        U.rr(ctx, c.x, c.y, c.w, c.h, 10);
        ctx.stroke();
        ctx.restore();
        /* 植物图 */
        ctx.save();
        ctx.translate(c.x + c.w / 2, c.y + c.h - 26);
        ctx.scale(0.62, 0.62);
        SP.plant(ctx, c.type, { anim: { t: this.t + this.cards.indexOf(c) }, seed: 1, hp: 1, maxHp: 1, armed: true });
        ctx.restore();
        U.text(ctx, PLANTS[c.type].name, c.x + c.w / 2, c.y + 16, {
          size: 14, fill: picked ? '#3A2A10' : '#D8D8C8',
        });
        /* 阳光费 */
        SP.sunIcon(ctx, c.x + 20, c.y + c.h - 12, 7);
        U.text(ctx, String(PLANTS[c.type].cost), c.x + c.w - 18, c.y + c.h - 12, {
          size: 13, fill: picked ? '#2A2A2A' : '#BBB',
        });
      }

      for (const b of this.buttons) b.draw(ctx);
    }
  }

  /* ============ 图鉴场景 ============ */
  class AlmanacScene extends Scene {
    constructor(game, tab = 'plant') {
      super(game);
      this.game = game;
      this.tab = tab;
      this.detail = null;
      const keys = Object.keys(PLANTS);
      this.plantKeys = keys;
      this.zombieKeys = Object.keys(ZOMBIES);
      /* 图鉴卡片布局（供点击检测） */
      this.cardRects = [];
      const cols = 6, cw = 118, chh = 118, gap = 14;
      const totalW = cols * cw + (cols - 1) * gap;
      const x0 = G.W / 2 - totalW / 2, y0 = 96;
      this.cardLayout = { cols, cw, chh, gap, x0, y0 };
      this.buttons = [
        new Button(24, 20, 100, 44, '← 返回', { onClick: () => game.goto(new TitleScene(game)) }),
        new Button(G.W / 2 - 180, 542, 160, 44, '植 物', {
          top: tab === 'plant' ? '#C8EC9A' : '#F8D878', bottom: tab === 'plant' ? '#78B448' : '#C89828',
          onClick: () => game.goto(new AlmanacScene(game, 'plant')),
        }),
        new Button(G.W / 2 + 20, 542, 160, 44, '僵 尸', {
          top: tab === 'zombie' ? '#F0B8A0' : '#F8D878', bottom: tab === 'zombie' ? '#B86848' : '#C89828',
          onClick: () => game.goto(new AlmanacScene(game, 'zombie')),
        }),
      ];
    }
    handlePointer(p) {
      for (const b of this.buttons) if (b.handle(p)) return true;
      if (p.type === 'pointerdown') {
        if (this.detail) {
          this.detail = null;
          return true;
        }
        /* 点击卡片打开详情 */
        const keys = this.tab === 'plant' ? this.plantKeys : this.zombieKeys;
        const { cols, cw, chh, x0, y0 } = this.cardLayout;
        for (let i = 0; i < keys.length; i++) {
          const x = x0 + (i % cols) * (cw + this.cardLayout.gap);
          const y = y0 + Math.floor(i / cols) * (chh + this.cardLayout.gap);
          if (p.x >= x && p.x <= x + cw && p.y >= y && p.y <= y + chh) {
            this.detail = keys[i];
            A.S.click();
            return true;
          }
        }
      }
      return false;
    }
    draw(ctx) {
      SP.drawBackground(ctx);
      ctx.fillStyle = 'rgba(25,20,10,0.72)';
      ctx.fillRect(0, 0, G.W, G.H);

      if (!this.detail) {
        U.text(ctx, this.tab === 'plant' ? '植物图鉴' : '僵尸图鉴', G.W / 2, 60, {
          size: 36, fill: '#FFE060', stroke: '#3A2A10', strokeW: 6,
        });
        const keys = this.tab === 'plant' ? this.plantKeys : this.zombieKeys;
        const defs = this.tab === 'plant' ? PLANTS : ZOMBIES;
        const cols = 6, cw = 118, chh = 118, gap = 14;
        const totalW = cols * cw + (cols - 1) * gap;
        const x0 = G.W / 2 - totalW / 2, y0 = 96;
        keys.forEach((k, i) => {
          const x = x0 + (i % cols) * (cw + gap);
          const y = y0 + Math.floor(i / cols) * (chh + gap);
          ctx.save();
          ctx.fillStyle = 'rgba(245,235,200,0.92)';
          U.rr(ctx, x, y, cw, chh, 10);
          ctx.fill();
          ctx.strokeStyle = '#B89040';
          ctx.lineWidth = 2;
          U.rr(ctx, x, y, cw, chh, 10);
          ctx.stroke();
          ctx.restore();
          /* 图标 */
          ctx.save();
          ctx.translate(x + cw / 2, y + chh - 22);
          ctx.scale(0.66, 0.66);
          if (this.tab === 'plant') {
            SP.plant(ctx, k, { anim: { t: this.t + i }, seed: 1, hp: 1, maxHp: 1, armed: true });
          } else {
            SZ.draw(ctx, {
              type: k, chill: 0, helmHp: ZOMBIES[k].helm || 0, shieldHp: ZOMBIES[k].shield || 0,
              anim: { t: this.t + i, eating: false, dying: false, walkRate: 2.2 },
            });
          }
          ctx.restore();
          U.text(ctx, defs[k].name, x + cw / 2, y + 18, { size: 14, fill: '#3A2A10' });
          if (this.tab === 'plant') {
            SP.sunIcon(ctx, x + 22, y + chh - 14, 7);
            U.text(ctx, String(defs[k].cost), x + 40, y + chh - 14, { size: 12, fill: '#2A2A2A', align: 'left' });
          } else {
            const hp = (defs[k].body || 0) + (defs[k].helm || 0) + (defs[k].shield || 0);
            U.text(ctx, `血量 ${hp}`, x + cw / 2, y + chh - 14, { size: 12, fill: '#8A2A2A' });
          }
        });
      } else {
        /* 详情页 */
        const k = this.detail;
        const def = this.tab === 'plant' ? PLANTS[k] : ZOMBIES[k];
        ctx.save();
        ctx.fillStyle = 'rgba(248,240,210,0.96)';
        U.rr(ctx, G.W / 2 - 330, 70, 660, 440, 16);
        ctx.fill();
        ctx.strokeStyle = '#8A6818';
        ctx.lineWidth = 3;
        U.rr(ctx, G.W / 2 - 330, 70, 660, 440, 16);
        ctx.stroke();
        ctx.restore();
        /* 大图 */
        ctx.save();
        ctx.translate(G.W / 2 - 170, 420);
        ctx.scale(2.2, 2.2);
        if (this.tab === 'plant') {
          SP.plant(ctx, k, { anim: { t: this.t }, seed: 1, hp: 1, maxHp: 1, armed: true });
        } else {
          SZ.draw(ctx, {
            type: k, chill: 0, helmHp: def.helm || 0, shieldHp: def.shield || 0,
            anim: { t: this.t, eating: false, dying: false, walkRate: 2.2 },
          });
        }
        ctx.restore();
        U.text(ctx, def.name, G.W / 2 + 60, 120, { size: 30, fill: '#3A2A10' });
        U.text(ctx, def.en, G.W / 2 + 60, 152, { size: 15, fill: '#8A7A50' });
        /* 属性 */
        const lines = [];
        if (this.tab === 'plant') {
          lines.push(`阳光费用：${def.cost}`);
          lines.push(`冷却时间：${def.recharge} 秒`);
          lines.push(`耐久：${def.hp}`);
          if (def.shoot) lines.push(`伤害：${def.shoot.dmg}${def.shoot.count ? ' ×2' : ''} / ${def.shoot.interval}s`);
          if (def.shoot && def.shoot.chill) lines.push(`附加效果：冰冻减速 ${def.shoot.chill}s`);
          if (def.sun) lines.push(`生产：每 ${def.sun.next[0]}~${def.sun.next[1]}s 产 ${def.sun.value} 阳光`);
          if (def.dmg) lines.push(`爆发伤害：${def.dmg}`);
          if (def.arm) lines.push(`武装时间：${def.arm}s`);
          if (def.chew) lines.push(`咀嚼时间：${def.chew}s`);
        } else {
          lines.push(`总血量：${(def.body || 0) + (def.helm || 0) + (def.shield || 0)}`);
          if (def.helm) lines.push(`护甲血量：${def.helm}`);
          if (def.shield) lines.push(`手持物血量：${def.shield}`);
          lines.push(`啃食伤害：100 / 秒`);
          lines.push(`速度：${def.speed ? (Array.isArray(def.speed) ? def.speed[0].toFixed(0) + '~' + def.speed[1].toFixed(0) : def.speed) : '-'}`);
        }
        lines.forEach((l, i) => {
          U.text(ctx, l, G.W / 2 + 30, 195 + i * 26, { size: 15, fill: '#4A3A20', align: 'left' });
        });
        /* 描述 */
        U.text(ctx, def.desc, G.W / 2 + 60, 195 + lines.length * 26 + 30, {
          size: 14, fill: '#6A5A3A', align: 'left',
        });
        if (def.tip) {
          U.text(ctx, `小贴士：${def.tip}`, G.W / 2 + 60, 195 + lines.length * 26 + 58, {
            size: 14, fill: '#8A6818', align: 'left',
          });
        }
        U.text(ctx, '点击任意处返回列表', G.W / 2, 548, {
          size: 14, fill: 'rgba(255,255,255,0.8)', stroke: 'rgba(0,0,0,0.5)', strokeW: 3,
        });
      }
    }
  }

  /* ============ 设置场景 ============ */
  class SettingsScene extends Scene {
    constructor(game) {
      super(game);
      this.game = game;
      this.buttons = [
        new Button(24, 20, 100, 44, '← 返回', { onClick: () => game.goto(new TitleScene(game)) }),
        new Button(G.W / 2 - 100, 380, 200, 48, A.musicOn ? '音乐：开' : '音乐：关', {
          onClick: (b) => {
            A.setMusicOn(!A.musicOn);
            b.label = A.musicOn ? '音乐：开' : '音乐：关';
            b.opt.top = A.musicOn ? '#F8D878' : '#B8B8B8';
            b.opt.bottom = A.musicOn ? '#C89828' : '#8A8A8A';
          },
        }),
        new Button(G.W / 2 - 100, 440, 200, 48, A.sfxOn ? '音效：开' : '音效：关', {
          onClick: (b) => {
            A.setSfxOn(!A.sfxOn);
            b.label = A.sfxOn ? '音效：开' : '音效：关';
            b.opt.top = A.sfxOn ? '#F8D878' : '#B8B8B8';
            b.opt.bottom = A.sfxOn ? '#C89828' : '#8A8A8A';
          },
        }),
        new Button(G.W / 2 - 100, 500, 200, 48, '清除存档', {
          top: '#E89078', bottom: '#B04828',
          onClick: () => {
            U.save('unlocked', 1);
            U.save('cleared', 0);
            U.save('endlessUnlocked', false);
            U.save('bestWave', 0);
            this.game.save = { unlocked: 1, cleared: 0, endlessUnlocked: false };
          },
        }),
      ];
      /* 音量滑条交互 */
      this.sliders = [
        { label: '音乐音量', get: () => A.musicVol, set: (v) => A.setMusicVol(v), x: G.W / 2 - 130, y: 250, w: 260 },
        { label: '音效音量', get: () => A.sfxVol, set: (v) => A.setSfxVol(v), x: G.W / 2 - 130, y: 320, w: 260 },
      ];
      this.dragSlider = null;
    }
    handlePointer(p) {
      for (const b of this.buttons) if (b.handle(p)) return true;
      if (p.type === 'pointerdown') {
        for (const s of this.sliders) {
          if (p.y >= s.y - 20 && p.y <= s.y + 20 && p.x >= s.x - 20 && p.x <= s.x + s.w + 20) {
            this.dragSlider = s;
            return true;
          }
        }
      }
      if (p.type === 'pointermove' && this.dragSlider) {
        const v = U.clamp((p.x - this.dragSlider.x) / this.dragSlider.w, 0, 1);
        this.dragSlider.set(v);
        return true;
      }
      if (p.type === 'pointerup') this.dragSlider = null;
      return false;
    }
    draw(ctx) {
      SP.drawBackground(ctx);
      ctx.fillStyle = 'rgba(20,30,15,0.6)';
      ctx.fillRect(0, 0, G.W, G.H);
      U.text(ctx, '设 置', G.W / 2, 80, {
        size: 40, fill: '#FFE060', stroke: '#3A2A10', strokeW: 7,
      });

      /* 滑条 */
      for (const s of this.sliders) {
        U.text(ctx, s.label, s.x + s.w / 2, s.y - 26, { size: 15, fill: '#F0E8D0' });
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        U.rr(ctx, s.x, s.y - 8, s.w, 16, 8);
        ctx.fill();
        ctx.fillStyle = '#F8D878';
        U.rr(ctx, s.x, s.y - 8, s.w * s.get(), 16, 8);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(s.x + s.w * s.get(), s.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#FFE9A0';
        ctx.fill();
        ctx.strokeStyle = '#8A6818';
        ctx.lineWidth = 2;
        ctx.stroke();
        U.text(ctx, Math.round(s.get() * 100) + '%', s.x + s.w + 40, s.y, { size: 14, fill: '#F0E8D0' });
      }

      for (const b of this.buttons) b.draw(ctx);
      U.text(ctx, '提示：游戏中 P 键暂停 · F 键 2 倍速 · M 键静音', G.W / 2, G.H - 24, {
        size: 14, fill: 'rgba(255,255,255,0.85)', stroke: 'rgba(0,0,0,0.5)', strokeW: 3,
      });
    }
  }

  /* ============ 游戏场景 ============ */
  class GameScene extends Scene {
    constructor(game, levelDef, chosen) {
      super(game);
      this.board = new PVZ.Board(game, levelDef, chosen);
      this.paused = false;
      this.speed = 1;
      this.winPanelT = 0;
      this.buttons = [];
      this.rebuildButtons();
    }
    rebuildButtons() {
      const g = this.game;
      /* 顶部圆形小按钮 */
      this.roundButtons = [
        {
          x: G.W - 150, y: 10, w: 42, h: 42, label: '❚❚', labelSize: 14, round: true,
          onClick: () => { this.togglePause(); },
        },
        {
          x: G.W - 100, y: 10, w: 42, h: 42, label: () => this.board.gameSpeed > 1 ? '×2' : '×1',
          labelSize: 16, round: true,
          onClick: () => {
            this.board.gameSpeed = this.board.gameSpeed > 1 ? 1 : 2;
            A.S.click();
          },
        },
        {
          x: G.W - 50, y: 10, w: 42, h: 42, label: () => A.musicOn ? '♪' : '—',
          labelSize: 18, round: true,
          onClick: () => { A.setMusicOn(!A.musicOn); },
        },
      ];
      /* 胜利/失败面板按钮 */
      this.panelButtons = [];
      if (this.board.state === 'win') {
        const next = g.nextLevel(this.board.level);
        this.panelButtons.push({
          x: G.W / 2 - 170, y: 330, w: 150, h: 50, label: '返回主菜单',
          onClick: () => g.goto(new TitleScene(g)),
        });
        this.panelButtons.push({
          x: G.W / 2 + 20, y: 330, w: 150, h: 50, label: next ? '下一关 →' : '再玩一次',
          onClick: () => {
            if (next) g.goto(new SeedSelectScene(g, next));
            else g.goto(new SeedSelectScene(g, this.board.level));
          },
        });
      } else if (this.board.state === 'lose') {
        this.panelButtons.push({
          x: G.W / 2 - 170, y: 340, w: 150, h: 50, label: '返回主菜单',
          onClick: () => g.goto(new TitleScene(g)),
        });
        this.panelButtons.push({
          x: G.W / 2 + 20, y: 340, w: 150, h: 50, label: '重新开始',
          onClick: () => g.goto(new SeedSelectScene(g, this.board.level)),
        });
      }
      this.buttons = this.roundButtons.concat(this.panelButtons);
    }
    togglePause() {
      if (this.board.state !== 'playing') return;
      this.paused = !this.paused;
      if (this.paused) A.stopMusic();
      else A.playMusic('day');
    }
    handlePointer(p) {
      /* 面板按钮（胜利/失败） */
      if (this.board.state === 'win' || this.board.state === 'lose') {
        if (p.type === 'pointerdown') {
          for (const b of this.panelButtons) {
            if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
              A.S.click();
              b.onClick();
              return true;
            }
          }
        }
        return false;
      }

      /* 顶部圆形按钮 */
      for (const b of this.roundButtons) {
        const inRect = p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
        if (p.type === 'pointermove') b.hover = inRect;
        else if (p.type === 'pointerdown' && inRect) {
          A.S.click();
          b.onClick();
          return true;
        }
      }

      if (this.paused) {
        /* 暂停面板按钮 */
        if (p.type === 'pointerdown') {
          const rects = [
            { x: G.W / 2 - 80, y: 280, w: 160, h: 46, label: '继 续', fn: () => this.togglePause() },
            { x: G.W / 2 - 80, y: 340, w: 160, h: 46, label: '重 新 开 始', fn: () => this.game.goto(new SeedSelectScene(this.game, this.board.level)) },
            { x: G.W / 2 - 80, y: 400, w: 160, h: 46, label: '返 回 菜 单', fn: () => this.game.goto(new TitleScene(this.game)) },
          ];
          for (const r of rects) {
            if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h) {
              A.S.click();
              r.fn();
              return true;
            }
          }
        }
        return false;
      }
      if (this.board.state !== 'playing') return false;

      const bd = this.board;
      /* 游戏内交互 */
      if (p.type === 'pointerdown') {
        /* 优先收集阳光 */
        if (bd.collectSunAt(p.x, p.y)) return true;
        /* 铲子模式 */
        if (bd.shovelMode) {
          const row = G.rowAt(p.y), col = G.colAt(p.x);
          if (bd.shovelAt(row, col)) {
            bd.shovelMode = false;
            return true;
          }
          bd.shovelMode = false;
          return true;
        }
        /* 卡片点击 */
        const cw = 56, chh = G.BANK_H - 22;
        for (let i = 0; i < bd.cards.length; i++) {
          const x = 88 + i * (cw + 5), y = 11;
          if (p.x >= x && p.x <= x + cw && p.y >= y && p.y <= y + chh) {
            const c = bd.cards[i];
            if (bd.sun >= PLANTS[c.type].cost && c.cd <= 0) {
              bd.selected = bd.selected === i ? -1 : i;
              bd.shovelMode = false;
              A.S.click();
            } else {
              A.S.error();
              bd.floatText('阳光不足！', x + cw / 2, y + chh + 14, '#FF6060');
            }
            return true;
          }
        }
        /* 铲子槽 */
        const sx = 88 + bd.cards.length * (cw + 5) + 8;
        if (p.x >= sx && p.x <= sx + 50 && p.y >= 11 && p.y <= 11 + chh) {
          bd.shovelMode = !bd.shovelMode;
          bd.selected = -1;
          A.S.click();
          return true;
        }
        /* 场地种植 */
        if (bd.selected >= 0) {
          const row = G.rowAt(p.y), col = G.colAt(p.x);
          if (bd.tryPlant(row, col)) return true;
        }
        return false;
      }
      if (p.type === 'pointermove') {
        bd.hoverCell = { row: G.rowAt(p.y), col: G.colAt(p.x) };
        /* 尝试沿途收集阳光（拖动收集） */
        bd.collectSunAt(p.x, p.y);
      }
      if (p.type === 'pointerup') {
        bd.hoverCell = null;
      }
      return false;
    }
    update(dt) {
      super.update(dt);
      if (this.board.state === 'win' && this.winPanelT === 0) {
        this.winPanelT = 0.001;
        this.rebuildButtons();
      }
      if (this.board.state === 'lose' && !this._loseBtns) {
        this._loseBtns = true;
        this.rebuildButtons();
        if (this.board.level.id === 'endless') {
          this.game.recordEndless(this.board.wave);
        }
      }
      if (!this.paused) {
        this.board.update(dt * this.board.gameSpeed);
      }
    }
    draw(ctx) {
      this.board.draw(ctx);

      /* 胜利面板 */
      if (this.board.state === 'win') {
        ctx.save();
        ctx.fillStyle = 'rgba(20,40,10,0.55)';
        ctx.fillRect(0, 0, G.W, G.H);
        ctx.fillStyle = 'rgba(248,240,210,0.96)';
        U.rr(ctx, G.W / 2 - 240, 140, 480, 280, 18);
        ctx.fill();
        ctx.strokeStyle = '#B89040';
        ctx.lineWidth = 3;
        U.rr(ctx, G.W / 2 - 240, 140, 480, 280, 18);
        ctx.stroke();
        U.text(ctx, '关卡完成！', G.W / 2, 200, { size: 40, fill: '#3A7A10' });
        U.text(ctx, `击杀僵尸：${this.board.zombiesKilled} 只`, G.W / 2, 250, { size: 18, fill: '#4A3A20' });
        const lv = this.board.level;
        if (lv.id !== 'endless') {
          U.text(ctx, '下一关已解锁，新植物等你使用！', G.W / 2, 285, { size: 16, fill: '#8A6818' });
        } else {
          U.text(ctx, `坚持到了第 ${this.board.wave} 波！`, G.W / 2, 285, { size: 16, fill: '#8A6818' });
        }
        this.drawPanelButtons(ctx);
        ctx.restore();
      }

      /* 失败面板按钮（延迟出现） */
      if (this.board.state === 'lose' && this.board.stateT > 2.2) {
        this.drawPanelButtons(ctx);
      }

      /* 暂停面板 */
      if (this.paused) {
        ctx.save();
        ctx.fillStyle = 'rgba(10,20,8,0.6)';
        ctx.fillRect(0, 0, G.W, G.H);
        U.text(ctx, '暂 停', G.W / 2, 200, {
          size: 48, fill: '#FFE060', stroke: '#3A2A10', strokeW: 8,
        });
        const rects = [
          { x: G.W / 2 - 80, y: 280, w: 160, h: 46, label: '继 续' },
          { x: G.W / 2 - 80, y: 340, w: 160, h: 46, label: '重 新 开 始' },
          { x: G.W / 2 - 80, y: 400, w: 160, h: 46, label: '返 回 菜 单' },
        ];
        for (const r of rects) {
          ctx.fillStyle = '#F8D878';
          U.rr(ctx, r.x, r.y, r.w, r.h, 10);
          ctx.fill();
          ctx.strokeStyle = '#8A6818';
          ctx.lineWidth = 2.5;
          U.rr(ctx, r.x, r.y, r.w, r.h, 10);
          ctx.stroke();
          U.text(ctx, r.label, r.x + r.w / 2, r.y + r.h / 2 + 1, { size: 18, fill: '#5A3A10' });
        }
        ctx.restore();
      }
    }
    drawPanelButtons(ctx) {
      for (const b of this.panelButtons) {
        ctx.save();
        const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
        g.addColorStop(0, '#FFE9A0');
        g.addColorStop(1, '#E8B040');
        ctx.fillStyle = g;
        U.rr(ctx, b.x, b.y, b.w, b.h, 10);
        ctx.fill();
        ctx.strokeStyle = '#8A6818';
        ctx.lineWidth = 2.5;
        U.rr(ctx, b.x, b.y, b.w, b.h, 10);
        ctx.stroke();
        U.text(ctx, b.label, b.x + b.w / 2, b.y + b.h / 2 + 1, { size: 17, fill: '#5A3A10' });
        ctx.restore();
      }
    }
  }

  PVZ.Button = Button;
  PVZ.TitleScene = TitleScene;
  PVZ.LevelSelectScene = LevelSelectScene;
  PVZ.SeedSelectScene = SeedSelectScene;
  PVZ.AlmanacScene = AlmanacScene;
  PVZ.SettingsScene = SettingsScene;
  PVZ.GameScene = GameScene;
})(window);

</script>
<script>
/* web-pvz — main.js
 * 入口：游戏循环（固定时间步长）、场景管理、输入路由、存档、快捷键
 */
(function (global) {
  'use strict';
  const PVZ = (global.PVZ = global.PVZ || {});
  const { U, G, LEVELS } = PVZ;
  const { A } = PVZ;

  class Game {
    constructor(canvas) {
      this.canvas = canvas;
      this.ctx = canvas.getContext('2d');
      this.canvas._dpr = 1;
      this.scene = null;
      this.save = {
        unlocked: U.load('unlocked', 1),
        cleared: U.load('cleared', 0),
        endlessUnlocked: U.load('endlessUnlocked', false),
      };
      this.audioUnlocked = false;
      this.lastTime = 0;
      this.acc = 0;
      this.stepSize = 1 / 60;
      this._bindInput();
      this._fit();
      window.addEventListener('resize', () => this._fit());
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && this.scene instanceof PVZ.GameScene && !this.scene.paused) {
          this.scene.togglePause();
        }
      });
    }

    _fit() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      this.canvas._dpr = dpr;
      this.canvas.width = G.W * dpr;
      this.canvas.height = G.H * dpr;
      this.scale = Math.min(window.innerWidth / G.W, window.innerHeight / G.H);
      this.offsetX = (window.innerWidth - G.W * this.scale) / 2;
      this.offsetY = (window.innerHeight - G.H * this.scale) / 2;
      /* 等比缩放 + 居中信箱式布局 */
      this.canvas.style.width = Math.round(G.W * this.scale) + 'px';
      this.canvas.style.height = Math.round(G.H * this.scale) + 'px';
      this.canvas.style.position = 'absolute';
      this.canvas.style.left = Math.round(this.offsetX) + 'px';
      this.canvas.style.top = Math.round(this.offsetY) + 'px';
      this.canvas.style.right = 'auto';
      this.canvas.style.bottom = 'auto';
    }

    _bindInput() {
      U.onPointer(this.canvas, (p) => {
        A.unlock();
        if (this.scene) this.scene.handlePointer(p);
      });
      window.addEventListener('keydown', (e) => {
        if (this.scene instanceof PVZ.GameScene) {
          if (e.key === 'p' || e.key === 'P') this.scene.togglePause();
          if (e.key === 'f' || e.key === 'F') {
            this.scene.board.gameSpeed = this.scene.board.gameSpeed > 1 ? 1 : 2;
          }
          if (e.key === 'm' || e.key === 'M') A.setMusicOn(!A.musicOn);
          if (e.key === 'Escape') {
            this.scene.board.selected = -1;
            this.scene.board.shovelMode = false;
          }
        }
      });
    }

    goto(scene) {
      this.scene = scene;
    }

    startLevel(levelDef, chosen) {
      const picked = chosen && chosen.length ? chosen : levelDef.plants.slice(0, Math.min(levelDef.slots, levelDef.plants.length));
      this.goto(new PVZ.GameScene(this, levelDef, picked));
    }

    nextLevel(levelDef) {
      if (levelDef.id === 'endless') return null;
      const idx = LEVELS.findIndex((l) => l.id === levelDef.id);
      if (idx < 0 || idx >= LEVELS.length - 1) return null;
      return LEVELS[idx + 1];
    }

    onLevelWin(levelDef) {
      if (levelDef.id === 'endless') return;
      const next = this.nextLevel(levelDef);
      if (next) {
        this.save.unlocked = Math.max(this.save.unlocked, next.id);
        this.save.cleared = Math.max(this.save.cleared, levelDef.id);
        if (next.id === 'endless' || levelDef.id === 5) {
          this.save.endlessUnlocked = true;
          this.save.cleared = 5;
        }
      } else {
        this.save.cleared = 5;
        this.save.endlessUnlocked = true;
      }
      U.save('unlocked', this.save.unlocked);
      U.save('cleared', this.save.cleared);
      U.save('endlessUnlocked', this.save.endlessUnlocked);
    }

    /* 无尽模式最高纪录 */
    recordEndless(wave) {
      const best = U.load('bestWave', 0);
      if (wave > best) U.save('bestWave', wave);
    }

    /* 顶部圆形小按钮（由 GameScene 定义，Game 统一绘制） */
    drawTopButtons(ctx) {
      const gs = this.scene;
      if (!(gs instanceof PVZ.GameScene)) return;
      const btns = gs.roundButtons || [];
      for (const b of btns) {
        ctx.save();
        ctx.fillStyle = b.hover ? 'rgba(250,235,190,0.95)' : 'rgba(120,90,50,0.8)';
        ctx.beginPath();
        ctx.arc(b.x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(60,40,20,0.9)';
        ctx.lineWidth = 2;
        ctx.stroke();
        const label = typeof b.label === 'function' ? b.label() : b.label;
        U.text(ctx, label, b.x + b.w / 2, b.y + b.h / 2 + 1, { size: b.labelSize || 16 });
        ctx.restore();
      }
    }

    update(dt) {
      if (this.scene) this.scene.update(dt);
    }

    draw() {
      const ctx = this.ctx;
      ctx.save();
      ctx.setTransform(this.canvas._dpr, 0, 0, this.canvas._dpr, 0, 0);
      /* 黑边 */
      ctx.fillStyle = '#101418';
      ctx.fillRect(0, 0, G.W, G.H);
      if (this.scene) this.scene.draw(ctx);
      ctx.restore();
    }

    loop(t) {
      requestAnimationFrame((tt) => this.loop(tt));
      if (!this.lastTime) this.lastTime = t;
      let delta = (t - this.lastTime) / 1000;
      this.lastTime = t;
      if (delta > 0.1) delta = 0.1;
      this.acc += delta;
      while (this.acc >= this.stepSize) {
        this.update(this.stepSize);
        this.acc -= this.stepSize;
      }
      this.draw();
    }

    start() {
      this.goto(new PVZ.TitleScene(this));
      requestAnimationFrame((tt) => this.loop(tt));
    }
  }

  /* ============ 启动 ============ */
  function boot() {
    const canvas = document.getElementById('game');
    if (!canvas) return;
    const game = new Game(canvas);
    PVZ.game = game;
    game.start();

    /* 首次交互前显示音频提示遮罩 */
    const hint = document.getElementById('audio-hint');
    const dismiss = () => {
      if (hint) hint.style.display = 'none';
      A.unlock();
      window.removeEventListener('pointerdown', dismiss);
    };
    window.addEventListener('pointerdown', dismiss);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(window);

</script>
</body>
</html>
