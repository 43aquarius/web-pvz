<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>植物大战僵尸 Web 版 · PvZ Web Edition</title>
<meta name="description" content="基于 HTML5 Canvas 的植物大战僵尸复刻版：全程序化矢量绘制 + Web Audio 合成音乐，零外部资源，单文件可玩。">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #101418;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Microsoft YaHei UI', sans-serif;
    touch-action: none;
  }
  #game {
    position: absolute;
    display: block;
    image-rendering: auto;
    cursor: pointer;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
  }
  #audio-hint {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    background: rgba(0,0,0,0.45);
    padding: 8px 18px;
    border-radius: 20px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<div id="audio-hint">🔇 点击任意位置开启声音</div>

<!-- 源码版按顺序加载模块（发布版由 tools/build.py 内联合并为单文件） -->
<script>
/* web-pvz — util.js
 * 基础工具：随机数、数学、颜色、画布辅助
 * 依据 PvZ-Portable 的 RandRangeFloat 语义实现随机区间
 */
(function (global) {
  'use strict';
  const PVZ = (global.PVZ = global.PVZ || {});

  const U = {};

  /* ---------- 数学 ---------- */
  U.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.rand = (a, b) => a + Math.random() * (b - a);
  U.randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
  U.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  /* 加权随机：items=[{w,...}] */
  U.weighted = (items) => {
    let total = 0;
    for (const it of items) total += it.w;
    let r = Math.random() * total;
    for (const it of items) {
      r -= it.w;
      if (r <= 0) return it;
    }
    return items[items.length - 1];
  };
  U.dist2 = (x1, y1, x2, y2) => {
    const dx = x1 - x2, dy = y1 - y2;
    return dx * dx + dy * dy;
  };

  /* ---------- 颜色 ---------- */
  U.shade = (hex, amt) => {
    /* hex: #rrggbb, amt: -1..1 */
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amt >= 0) {
      r = Math.round(r + (255 - r) * amt);
      g = Math.round(g + (255 - g) * amt);
      b = Math.round(b + (255 - b) * amt);
    } else {
      const k = 1 + amt;
      r = Math.round(r * k); g = Math.round(g * k); b = Math.round(b * k);
    }
    return `rgb(${r},${g},${b})`;
  };
  U.rgba = (hex, a) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  };

  /* ---------- 画布辅助 ---------- */
  U.rr = (ctx, x, y, w, h, r) => {
    /* 圆角矩形路径 */
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  };
  U.circle = (ctx, x, y, r) => {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
  };
  U.ellipse = (ctx, x, y, rx, ry, rot = 0) => {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
  };
  /* 带阴影描边填充的文本 */
  U.text = (ctx, str, x, y, opt = {}) => {
    const size = opt.size || 16;
    const font = opt.font || `'Comic Sans MS','Chalkboard SE','Microsoft YaHei UI','Segoe UI Rounded',sans-serif`;
    ctx.save();
    ctx.font = `${opt.weight || 'bold'} ${size}px ${font}`;
    ctx.textAlign = opt.align || 'center';
    ctx.textBaseline = opt.baseline || 'middle';
    if (opt.stroke) {
      ctx.lineWidth = opt.strokeW || Math.max(2, size / 8);
      ctx.strokeStyle = opt.stroke;
      ctx.lineJoin = 'round';
      ctx.strokeText(str, x, y);
    }
    ctx.fillStyle = opt.fill || '#fff';
    ctx.fillText(str, x, y);
    ctx.restore();
  };

  /* ---------- 时间 ---------- */
  U.now = () => performance.now();
  U.fmtTime = (s) => {
    const m = Math.floor(s / 60), ss = Math.floor(s % 60);
    return `${m}:${ss < 10 ? '0' : ''}${ss}`;
  };

  /* ---------- localStorage 封装 ---------- */
  U.save = (key, val) => {
    try { localStorage.setItem('webpvz_' + key, JSON.stringify(val)); } catch (e) { /* 忽略 */ }
  };
  U.load = (key, def) => {
    try {
      const v = localStorage.getItem('webpvz_' + key);
      return v == null ? def : JSON.parse(v);
    } catch (e) { return def; }
  };

  /* ---------- 事件封装（指针统一） ---------- */
  U.onPointer = (el, fn) => {
    const handler = (e) => {
      const rect = el.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (el.width / rect.width / (el._dpr || 1));
      const y = (e.clientY - rect.top) * (el.height / rect.height / (el._dpr || 1));
      e.preventDefault();
      fn({ x, y, type: e.type, button: e.button });
      return false;
    };
    el.addEventListener('pointerdown', handler);
    el.addEventListener('pointermove', handler);
    el.addEventListener('pointerup', handler);
    el.addEventListener('contextmenu', (e) => e.preventDefault());
  };

  PVZ.U = U;
})(window);

</script>
<script>
/* web-pvz — audio.js
 * Web Audio 程序化合成引擎：音乐序列器 + 音效
 * 全部声音均为运行时合成，不含任何外部素材（零版权风险）
 */
(function (global) {
  'use strict';
  const PVZ = (global.PVZ = global.PVZ || {});
  const { U } = PVZ;

  const A = {
    ctx: null,
    master: null,
    musicBus: null,
    sfxBus: null,
    noiseBuf: null,
    musicOn: U.load('musicOn', true),
    sfxOn: U.load('sfxOn', true),
    musicVol: U.load('musicVol', 0.7),
    sfxVol: U.load('sfxVol', 0.9),
    _seq: null,       /* 当前序列器状态 */
    _curSong: null,
  };

  /* ============ 初始化 ============ */
  A.init = () => {
    if (A.ctx) return;
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    A.ctx = new Ctx();
    A.master = A.ctx.createGain();
    A.master.gain.value = 1;
    A.master.connect(A.ctx.destination);

    A.musicBus = A.ctx.createGain();
    A.musicBus.gain.value = A.musicOn ? A.musicVol : 0;
    A.musicBus.connect(A.master);

    A.sfxBus = A.ctx.createGain();
    A.sfxBus.gain.value = A.sfxOn ? A.sfxVol : 0;
    A.sfxBus.connect(A.master);

    /* 预生成噪声缓冲（2秒白噪声，供打击乐与爆炸复用） */
    const len = A.ctx.sampleRate * 2;
    A.noiseBuf = A.ctx.createBuffer(1, len, A.ctx.sampleRate);
    const d = A.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  };

  A.unlock = () => {
    A.init();
    if (A.ctx && A.ctx.state === 'suspended') A.ctx.resume();
  };

  A.setMusicOn = (on) => { A.musicOn = on; U.save('musicOn', on); if (A.musicBus) A.musicBus.gain.value = on ? A.musicVol : 0; };
  A.setSfxOn = (on) => { A.sfxOn = on; U.save('sfxOn', on); if (A.sfxBus) A.sfxBus.gain.value = on ? A.sfxVol : 0; };
  A.setMusicVol = (v) => { A.musicVol = v; U.save('musicVol', v); if (A.musicBus && A.musicOn) A.musicBus.gain.value = v; };
  A.setSfxVol = (v) => { A.sfxVol = v; U.save('sfxVol', v); if (A.sfxBus && A.sfxOn) A.sfxBus.gain.value = v; };

  const midiHz = (m) => 440 * Math.pow(2, (m - 69) / 12);

  /* ============ 乐器 ============ */
  /* 方波主旋律（带轻微失谐，游戏感） */
  A.lead = (t, midi, dur, vel = 0.5, bus) => {
    const c = A.ctx, g = c.createGain();
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    o1.type = 'square'; o2.type = 'square';
    o1.frequency.value = midiHz(midi);
    o2.frequency.value = midiHz(midi) * 1.003;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 2600;
    o1.connect(f); o2.connect(f); f.connect(g);
    g.connect(bus || A.musicBus);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel * 0.55, t + 0.015);
    g.gain.setValueAtTime(vel * 0.55, t + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o1.start(t); o2.start(t);
    o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  };

  /* 柔和三角波（菜单/夜晚八音盒风格） */
  A.soft = (t, midi, dur, vel = 0.5, bus) => {
    const c = A.ctx, g = c.createGain();
    const o1 = c.createOscillator(), o2 = c.createOscillator();
    o1.type = 'triangle'; o2.type = 'sine';
    o1.frequency.value = midiHz(midi);
    o2.frequency.value = midiHz(midi + 12);
    const g2 = c.createGain(); g2.gain.value = 0.35;
    o1.connect(g); o2.connect(g2); g2.connect(g);
    g.connect(bus || A.musicBus);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel * 0.6, t + 0.02);
    g.gain.setValueAtTime(vel * 0.6, t + dur * 0.75);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o1.start(t); o2.start(t + 0.06);
    o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  };

  /* 低音 */
  A.bass = (t, midi, dur, vel = 0.6, bus) => {
    const c = A.ctx, g = c.createGain();
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.value = midiHz(midi);
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 700;
    o.connect(f); f.connect(g); g.connect(bus || A.musicBus);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vel * 0.7, t + 0.02);
    g.gain.setValueAtTime(vel * 0.7, t + dur * 0.8);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.start(t); o.stop(t + dur + 0.05);
  };

  /* 底鼓 */
  A.kick = (t, vel = 0.8, bus) => {
    const c = A.ctx, g = c.createGain(), o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    o.connect(g); g.connect(bus || A.musicBus);
    g.gain.setValueAtTime(vel, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    o.start(t); o.stop(t + 0.2);
  };

  /* 军鼓（噪声） */
  A.snare = (t, vel = 0.5, bus) => {
    const c = A.ctx, src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf;
    src.loop = true;
    f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 0.8;
    src.connect(f); f.connect(g); g.connect(bus || A.musicBus);
    g.gain.setValueAtTime(vel * 0.6, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    src.start(t); src.stop(t + 0.15);
  };

  /* 镲 */
  A.hat = (t, vel = 0.3, bus) => {
    const c = A.ctx, src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf;
    src.loop = true;
    f.type = 'highpass'; f.frequency.value = 7000;
    src.connect(f); f.connect(g); g.connect(bus || A.musicBus);
    g.gain.setValueAtTime(vel * 0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    src.start(t); src.stop(t + 0.08);
  };

  /* 锣/大鼓（大波渲染） */
  A.boom = (t, vel = 0.9, bus) => {
    const c = A.ctx, g = c.createGain();
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(30, t + 0.8);
    o.connect(g); g.connect(bus || A.musicBus);
    g.gain.setValueAtTime(vel, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 1.1);
    o.start(t); o.stop(t + 1.2);
    const src = c.createBufferSource(), g2 = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf; src.loop = true;
    f.type = 'lowpass'; f.frequency.value = 400;
    src.connect(f); f.connect(g2); g2.connect(bus || A.musicBus);
    g2.gain.setValueAtTime(vel * 0.5, t);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.9);
    src.start(t); src.stop(t + 1);
  };

  /* ============ 音效 ============ */
  const S = {};
  S.click = () => A.sfx((t) => { A.lead(t, 84, 0.08, 0.25, A.sfxBus); });
  S.hover = () => A.sfx((t) => { A.soft(t, 88, 0.06, 0.12, A.sfxBus); });
  S.plant = () => A.sfx((t) => {
    /* 种植：泥土扑通声 */
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.15);
    o.connect(g); g.connect(A.sfxBus);
    g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.start(t); o.stop(t + 0.2);
    const src = c.createBufferSource(), gg = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf; f.type = 'lowpass'; f.frequency.value = 900;
    src.connect(f); f.connect(gg); gg.connect(A.sfxBus);
    gg.gain.setValueAtTime(0.3, t); gg.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    src.start(t); src.stop(t + 0.14);
  });
  S.shovel = () => A.sfx((t) => {
    const c = A.ctx, src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf; f.type = 'bandpass';
    f.frequency.setValueAtTime(2500, t);
    f.frequency.exponentialRampToValueAtTime(600, t + 0.2);
    src.connect(f); f.connect(g); g.connect(A.sfxBus);
    g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    src.start(t); src.stop(t + 0.28);
  });
  S.sun = () => A.sfx((t) => {
    /* 收集阳光：清亮琶音 */
    [79, 84, 88, 91].forEach((m, i) => A.soft(t + i * 0.05, m, 0.35, 0.3, A.sfxBus));
  });
  S.sunspawn = () => A.sfx((t) => A.soft(t, 88, 0.2, 0.08, A.sfxBus));
  S.shoot = () => A.sfx((t) => {
    /* 发射：短促气声 */
    const c = A.ctx, src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf; f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 2;
    src.connect(f); f.connect(g); g.connect(A.sfxBus);
    g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    src.start(t); src.stop(t + 0.09);
  });
  S.splats = [
    () => A.sfx((t) => { const c = A.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(420, t); o.frequency.exponentialRampToValueAtTime(160, t + 0.06); o.connect(g); g.connect(A.sfxBus); g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08); o.start(t); o.stop(t + 0.1); }),
    () => A.sfx((t) => { const c = A.ctx, o = c.createOscillator(), g = c.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(360, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.08); o.connect(g); g.connect(A.sfxBus); g.gain.setValueAtTime(0.26, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1); o.start(t); o.stop(t + 0.12); }),
  ];
  S.splat = () => U.pick(S.splats)();
  S.freeze = () => A.sfx((t) => {
    [96, 91, 98].forEach((m, i) => A.soft(t + i * 0.04, m, 0.4, 0.16, A.sfxBus));
    const c = A.ctx, src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf; f.type = 'highpass'; f.frequency.value = 5000;
    src.connect(f); f.connect(g); g.connect(A.sfxBus);
    g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    src.start(t); src.stop(t + 0.4);
  });
  S.explode = () => A.sfx((t) => {
    /* 爆炸：噪声轰 + 低频下坠 */
    const c = A.ctx, src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf; src.loop = true;
    f.type = 'lowpass'; f.frequency.setValueAtTime(3000, t);
    f.frequency.exponentialRampToValueAtTime(200, t + 0.7);
    src.connect(f); f.connect(g); g.connect(A.sfxBus);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    src.start(t); src.stop(t + 0.85);
    const o = c.createOscillator(), g2 = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(110, t);
    o.frequency.exponentialRampToValueAtTime(35, t + 0.6);
    o.connect(g2); g2.connect(A.sfxBus);
    g2.gain.setValueAtTime(0.8, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    o.start(t); o.stop(t + 0.75);
  });
  S.chomp = () => A.sfx((t) => {
    const c = A.ctx, src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf; f.type = 'lowpass'; f.frequency.value = 500;
    src.connect(f); f.connect(g); g.connect(A.sfxBus);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    src.start(t); src.stop(t + 0.18);
    const o = c.createOscillator(), g2 = c.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(60, t + 0.12);
    o.connect(g2); g2.connect(A.sfxBus);
    g2.gain.setValueAtTime(0.3, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    o.start(t); o.stop(t + 0.16);
  });
  S.swallow = () => A.sfx((t) => {
    const c = A.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(80, t + 0.4);
    o.connect(g); g.connect(A.sfxBus);
    g.gain.setValueAtTime(0.35, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.start(t); o.stop(t + 0.5);
  });
  S.eat = () => A.sfx((t) => {
    /* 僵尸啃食：咔嚓 */
    const c = A.ctx, src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    src.buffer = A.noiseBuf; f.type = 'bandpass';
    f.frequency.value = 350 + Math.random() * 250; f.Q.value = 1.5;
    src.connect(f); f.connect(g); g.connect(A.sfxBus);
    g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    src.start(t); src.stop(t + 0.12);
  });
  S.groan = () => A.sfx((t) => {
    /* 僵尸低吼：锯齿波颤音 */
    const c = A.ctx, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter(), lfo = c.createOscillator(), lg = c.createGain();
    o.type = 'sawtooth';
    const base = 70 + Math.random() * 40;
    o.frequency.setValueAtTime(base, t);
    o.frequency.linearRampToValueAtTime(base * 0.8, t + 0.6);
    lfo.frequency.value = 6 + Math.random() * 4;
    lg.gain.value = 8;

    if (A._seq) {
      clearInterval(A._seq.timer);
      A._seq = null;
    }

  };

  A._schedule = () => {
    const st = A._seq;
    if (!st || !A.ctx) return;
    const spb = 60 / st.song.tempo;
    const ahead = A.ctx.currentTime + 0.35;

    while (true) {
      const melody = st.song.melody, bass = st.song.bass;
      const loopStart = st.startTime + st.loop * st.song.totalBeats * spb;
      /* 主旋律 */
      if (st.nextNote < melody.length) {
        const [beat, midi, dur, vel] = melody[st.nextNote];
        const t = loopStart + beat * spb;
        if (t > ahead) break;
        if (t >= A.ctx.currentTime - 0.05) {
          if (st.song.name === 'night' || st.song.name === 'menu') A.soft(t, midi, dur * spb * 0.95, vel || 0.5);

        st.nextNote++;
        continue;
      }
      /* 低音 */
      if (st.nextBass < bass.length) {
        const [beat, midi, dur, vel] = bass[st.nextBass];
        const t = loopStart + beat * spb;
        if (t >= A.ctx.currentTime - 0.05) A.bass(t, midi, dur * spb * 0.95, vel || 0.6);
        st.nextBass++;
        continue;
      }
      /* 打击乐（按拍填充） */
      if (st.nextPercBeat < st.song.totalBeats) {
        const t = loopStart + st.nextPercBeat * spb;
        if (t > ahead) break;
        if (t >= A.ctx.currentTime - 0.05) {
          if (st.song.waltz) {
            if (st.nextPercBeat % 3 === 0) A.kick(t, 0.5);
            else A.hat(t, 0.35);
          } else {
            const b = st.nextPercBeat;
            if (b % 2 === 0) A.kick(t, 0.6);
            else A.snare(t, 0.35);
            A.hat(t + spb / 2, 0.2);
          }
        }
        st.nextPercBeat++;
        continue;
      }
      /* 循环 */
      st.loop++;
      st.nextNote = 0; st.nextBass = 0; st.nextPercBeat = 0;
    }
  };

  A.PVZ = PVZ;
  PVZ.A = A;

  /* ============ 僵尸定义 ============ */
  /* speed: 像素/秒（由源码 0.23~0.37 px/frame@60fps 换算） */
  const ZOMBIES = {
    normal: {
      name: '普通僵尸', en: 'Zombie', body: 270, speed: [13.8, 22.2], value: 1,
      desc: '最普通的僵尸，缓慢而坚定地向前挪动。',
    },
    flag: {
      name: '旗帜僵尸', en: 'Flag Zombie', body: 270, speed: [20, 28], value: 1,
      desc: '旗帜僵尸标志着一大波僵尸的到来。',
    },
    cone: {
      name: '路障僵尸', en: 'Conehead Zombie', body: 270, helm: 370, speed: [13.8, 22.2], value: 2,
      desc: '戴上了路障的僵尸，防御力提升了一倍。',
    },
    pole: {
      name: '撑杆跳僵尸', en: 'Pole Vaulting Zombie', body: 500, speed: [38, 42], value: 2,
      desc: '撑杆跳僵尸能跃过第一个遇到的植物。',
    },
    bucket: {
      name: '铁桶僵尸', en: 'Buckethead Zombie', body: 270, helm: 1100, speed: [13.8, 22.2], value: 4,
      desc: '头顶铁桶的僵尸，防御力极高。',
    },
    news: {
      name: '报纸僵尸', en: 'Newspaper Zombie', body: 270, shield: 150, speed: [13.8, 22.2], value: 2,
      rageSpeed: [52, 56],
      desc: '报纸被毁后会陷入狂暴，速度大幅提升。',
    },
    football: {
      name: '橄榄球僵尸', en: 'Football Zombie', body: 270, helm: 1400, speed: [36, 42], value: 5,
      desc: '橄榄球僵尸又快又硬，是夜场的劲敌。',
    },
  };

  /* 僵尸啃食 DPS（原版 100/s） */
  const ZOMBIE_DPS = 100;
  /* 冰冻减速系数（CHILLED_SPEED_FACTOR = 0.4） */
  const CHILL_FACTOR = 0.4;

  /* ============ 关卡定义 ============ */
  /* waveNum: 总波数; spawns: [类型, 权重]; flagEvery: 大波间隔 */
  const LEVELS = [
    {
      id: 1, name: '第 1 关', theme: 'day', waves: 10, startSun: 150, slots: 6,
      spawns: [['normal', 100]],
      plants: ['sunflower', 'peashooter', 'wallnut', 'potatomine', 'cherrybomb'],
      intro: '僵尸来了！用豌豆射手守住前院。',
    },
    {
      id: 2, name: '第 2 关', theme: 'day', waves: 15, startSun: 100, slots: 6,
      spawns: [['normal', 70], ['cone', 30]],
      plants: ['sunflower', 'peashooter', 'wallnut', 'potatomine', 'cherrybomb', 'snowpea', 'repeater'],
      intro: '路障僵尸出现了，火力需要升级。',
    },
    {
      id: 3, name: '第 3 关', theme: 'day', waves: 20, startSun: 100, slots: 8,
      spawns: [['normal', 50], ['cone', 30], ['pole', 20]],
      plants: ['sunflower', 'peashooter', 'wallnut', 'potatomine', 'cherrybomb', 'snowpea', 'repeater', 'squash', 'jalapeno'],
      intro: '撑杆跳僵尸会跃过第一个植物，注意布阵。',
    },
    {
      id: 4, name: '第 4 关', theme: 'day', waves: 25, startSun: 75, slots: 8,
      spawns: [['normal', 40], ['cone', 28], ['pole', 15], ['bucket', 17]],
      plants: ['sunflower', 'peashooter', 'wallnut', 'potatomine', 'cherrybomb', 'snowpea', 'repeater', 'squash', 'jalapeno', 'torchwood', 'chomper'],
      intro: '铁桶僵尸防御惊人，樱桃炸弹别攒着不用。',
    },
    {
      id: 5, name: '第 5 关', theme: 'day', waves: 30, startSun: 75, slots: 10,
      spawns: [['normal', 28], ['cone', 24], ['pole', 14], ['bucket', 16], ['news', 10], ['football', 8]],
      plants: ['sunflower', 'peashooter', 'wallnut', 'potatomine', 'cherrybomb', 'snowpea', 'repeater', 'squash', 'jalapeno', 'torchwood', 'chomper', 'tallnut'],
      intro: '最终决战！守住这波，前院就安全了。',
    },
    {
      id: 'endless', name: '无尽模式', theme: 'day', waves: Infinity, startSun: 150, slots: 10,
      spawns: [['normal', 30], ['cone', 25], ['pole', 12], ['bucket', 15], ['news', 10], ['football', 8]],
      plants: Object.keys(PLANTS),
      intro: ' endless：看你能撑过多少波僵尸。',
    },
  ];

  /* ============ 波次生成 ============ */
  const waveBudget = (wave, flagEvery) => {
    let b = 1 + wave * 0.55;
    if (flagEvery && wave % flagEvery === 0) b *= 2.6;
    return b;
  };
  const isFlagWave = (wave, flagEvery) => flagEvery && wave % flagEvery === 0;

  PVZ.G = G;
  PVZ.PLANTS = PLANTS;
  PVZ.ZOMBIES = ZOMBIES;
  PVZ.ZOMBIE_DPS = ZOMBIE_DPS;
  PVZ.CHILL_FACTOR = CHILL_FACTOR;
  PVZ.LEVELS = LEVELS;
  PVZ.waveBudget = waveBudget;
  PVZ.isFlagWave = isFlagWave;
})(window);

<script>
/* web-pvz — sprites.js
 * 程序化矢量绘制：场景背景、植物、阳光、子弹、割草机、UI 元素
 * 所有图形运行时用 Canvas 2D 绘制，无外部素材
 */
(function (global) {
  'use strict';
  const PVZ = (global.PVZ = global.PVZ || {});
  const { U, G, PLANTS } = PVZ;
  const SP = {};

  /* ============ 背景 ============ */
  SP.drawBackground = (ctx) => {
    const W = G.W, H = G.H;
    /* 天空 */
    let sky = ctx.createLinearGradient(0, 0, 0, G.GRID_Y + 40);
    sky.addColorStop(0, '#7EC8E8');
    sky.addColorStop(1, '#C8E8F5');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, G.GRID_Y + 40);

    /* 云 */
    ctx.save();
    ctx.globalAlpha = 0.85;
    const cloud = (x, y, s) => {
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(x, y, 18 * s, 0, Math.PI * 2);
      ctx.arc(x + 22 * s, y - 8 * s, 22 * s, 0, Math.PI * 2);
      ctx.arc(x + 48 * s, y, 16 * s, 0, Math.PI * 2);
      ctx.arc(x + 26 * s, y + 8 * s, 18 * s, 0, Math.PI * 2);
      ctx.fill();
    };
    cloud(240, 42, 1);
    cloud(560, 30, 0.8);
    cloud(800, 55, 0.6);
    ctx.restore();

    /* 远处树篱 */
    ctx.fillStyle = '#3E7A2E';
    ctx.fillRect(0, G.GRID_Y - 46, W, 26);
    SP._bushes(ctx, 0, G.GRID_Y - 30, W, '#4E8C3A');

    /* 草坪格子 */
    for (let r = 0; r < G.ROWS; r++) {
      for (let c = 0; c < G.COLS; c++) {
        const x = G.GRID_X + c * G.CELL_W, y = G.GRID_Y + r * G.CELL_H;
        const light = (r + c) % 2 === 0;
        ctx.fillStyle = light ? '#6FBF44' : '#5FA83A';
        ctx.fillRect(x, y, G.CELL_W, G.CELL_H);
      }
    }
    /* 草坪顶部与底部边缘阴影 */
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    ctx.fillRect(G.GRID_X, G.GRID_Y, G.GRID_W, 6);
    ctx.fillRect(G.GRID_X, G.GRID_Y + G.GRID_H - 6, G.GRID_W, 6);

    /* 草坪外围泥土 */
    ctx.fillStyle = '#8A6B4A';
    ctx.fillRect(0, G.GRID_Y, G.GRID_X, G.GRID_H);
    ctx.fillRect(G.GRID_X + G.GRID_W, G.GRID_Y, W - G.GRID_X - G.GRID_W, G.GRID_H);
    ctx.fillRect(0, G.GRID_Y + G.GRID_H, W, H - G.GRID_Y - G.GRID_H);
    /* 泥土颗粒 */
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    for (let i = 0; i < 60; i++) {
      const rx = ((i * 137) % 977) / 977 * W;
      const ry = G.GRID_Y + G.GRID_H + ((i * 61) % 89) / 89 * (H - G.GRID_Y - G.GRID_H);
      ctx.fillRect(rx, ry, 4, 3);
    }
    /* 右侧小路（僵尸入场） */
    ctx.fillStyle = '#9A8B70';
    ctx.fillRect(G.GRID_X + G.GRID_W, G.GRID_Y - 10, 40, G.GRID_H + 20);
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(G.GRID_X + G.GRID_W + 34, G.GRID_Y - 10, 6, G.GRID_H + 20);

    /* 房子（最后绘制，覆盖左侧泥地，形成砖墙立面） */
    SP._house(ctx);
  };

  SP._bushes = (ctx, x0, y, w, color) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let x = x0; x < x0 + w; x += 34) {
      ctx.moveTo(x, y + 20);
      ctx.arc(x + 17, y + 6, 15 + ((x / 34) % 3) * 2, 0, Math.PI * 2);
    }
    ctx.fill();
  };

  SP._house = (ctx) => {
    const x = -4;
    const y = G.GRID_Y - 60;
    const wallW = 108;
    const wallH = H_TOTAL();
    function H_TOTAL() { return G.H - (y + 40) + 60; }
    /* 墙（覆盖左侧全高） */
    ctx.fillStyle = '#D9C6A5';
    ctx.fillRect(x, y + 40, wallW, wallH);
    /* 砖纹 */
    ctx.strokeStyle = 'rgba(160,130,95,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let by = y + 56; by < G.H + 30; by += 14) {
      ctx.moveTo(x, by); ctx.lineTo(x + wallW - 4, by);
    }
    ctx.stroke();
    ctx.beginPath();
    for (let by = y + 56, k = 0; by < G.H + 30; by += 14, k++) {
      const off = (k % 2) * 26 + 13;
      ctx.moveTo(x + off, by - 14); ctx.lineTo(x + off, by);
    }
    ctx.stroke();
    /* 屋顶（下移至种子栏以下可见） */
    ctx.fillStyle = '#8C5A3C';
    ctx.beginPath();
    ctx.moveTo(x - 14, y + 78);
    ctx.lineTo(x + 54, y + 18);
    ctx.lineTo(x + 122, y + 78);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#7A4C32';
    ctx.fillRect(x - 14, y + 72, 148, 10);
    /* 门 */
    ctx.fillStyle = '#6B4226';
    U.rr(ctx, x + 30, y + 116, 46, 84, 6);
    ctx.fill();
    ctx.fillStyle = '#D9C6A5';
    ctx.fillRect(x + 40, y + 116, 26, 84);
    ctx.fillStyle = '#6B4226';
    ctx.beginPath();
    ctx.arc(x + 68, y + 158, 3, 0, Math.PI * 2);
    ctx.fill();
    /* 窗 */
    ctx.fillStyle = '#5A7A9A';
    U.rr(ctx, x + 20, y + 92, 68, 36, 5);
    ctx.fill();
    ctx.strokeStyle = '#8C5A3C';
    ctx.lineWidth = 3;
    U.rr(ctx, x + 20, y + 92, 68, 36, 5);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 54, y + 92); ctx.lineTo(x + 54, y + 128);
    ctx.moveTo(x + 20, y + 110); ctx.lineTo(x + 88, y + 110);
    ctx.stroke();
  };

  /* ============ 通用植物部件 ============ */
  const leafPair = (ctx, s = 1, sway = 0) => {
    ctx.save();
    ctx.rotate(sway * 0.1);
    ctx.fillStyle = '#3E9A2E';
    ctx.beginPath();
    ctx.ellipse(-16 * s, -6 * s, 14 * s, 6 * s, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(16 * s, -6 * s, 14 * s, 6 * s, 0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2E7A20';
    ctx.lineWidth = 1.5 * s;
    ctx.beginPath();
    ctx.moveTo(-24 * s, -8 * s); ctx.lineTo(-8 * s, -4 * s);
    ctx.moveTo(24 * s, -8 * s); ctx.lineTo(8 * s, -4 * s);
    ctx.stroke();
    ctx.restore();
  };

  const stem = (ctx, h, sway) => {
    ctx.strokeStyle = '#3E9A2E';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(sway * 6, -h * 0.55, sway * 10, -h);
    ctx.stroke();
  };

  const face = (ctx, x, y, s, opt = {}) => {
    /* 眼睛 */
    const ew = opt.eyes || 5;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.ellipse(x - 8 * s, y, ew * s, ew * 1.25 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 8 * s, y, ew * s, ew * 1.25 * s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = opt.pupil || '#222';
    const px = (opt.look || 0) * 2 * s;
    ctx.beginPath();
    ctx.arc(x - 8 * s + px, y + 1 * s, ew * 0.45 * s, 0, Math.PI * 2);
    ctx.arc(x + 8 * s + px, y + 1 * s, ew * 0.45 * s, 0, Math.PI * 2);
    ctx.fill();
    /* 嘴 */
    ctx.strokeStyle = opt.mouth || '#3A2A1A';
    ctx.lineWidth = 2 * s;
    ctx.beginPath();
    if (opt.smile) {
      ctx.arc(x, y + 10 * s, 6 * s, 0.15 * Math.PI, 0.85 * Math.PI);
    } else {
      ctx.moveTo(x - 5 * s, y + 12 * s);
      ctx.lineTo(x + 5 * s, y + 12 * s);
    }
    ctx.stroke();
  };

  SP.face = face;
  SP.leafPair = leafPair;
  SP.stem = stem;

  /* ============ 植物绘制 ============ */
  /* 每个函数锚点：(0,0) = 格子底部中心；p = plant 实例（含 anim 状态） */
  const P = {};

  P.sunflower = (ctx, p) => {
    const t = p.anim.t;
    const sway = Math.sin(t * 2.2 + p.seed * 7);
    const glow = p.anim.sunGlow || 0;
    stem(ctx, 42, sway);
    leafPair(ctx, 1, sway);
    ctx.save();
    ctx.translate(sway * 10, -50);
    ctx.rotate(sway * 0.06);
    /* 发光 */
    if (glow > 0) {
      ctx.save();
      const r = 42 + glow * 10;
      const g = ctx.createRadialGradient(0, 0, 10, 0, 0, r);
      g.addColorStop(0, `rgba(255,220,80,${0.55 * glow})`);
      g.addColorStop(1, 'rgba(255,220,80,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    /* 花瓣 */
    ctx.fillStyle = '#FFC726';
    ctx.strokeStyle = '#E8A010';
    ctx.lineWidth = 1.5;
    const petals = 12;
    for (let i = 0; i < petals; i++) {
      const a = (i / petals) * Math.PI * 2 + Math.sin(t * 1.1) * 0.03;
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.ellipse(19, 0, 12, 6.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    /* 脸盘 */
    ctx.fillStyle = '#B8761A';
    ctx.beginPath(); ctx.arc(0, 0, 15.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#D8901F';
    ctx.beginPath(); ctx.arc(-3, -3, 12, 0, Math.PI * 2); ctx.fill();
    face(ctx, 0, -2, 0.9, { smile: true, look: Math.sin(t * 0.7) });
    ctx.restore();
  };

  const shooterHead = (ctx, p, palette, opts = {}) => {
    const t = p.anim.t;
    const recoil = p.anim.recoil || 0;
    const headY = -52;
    ctx.save();
    ctx.translate(recoil * -5, headY + Math.sin(t * 2 + p.seed * 5) * 1.5);
    /* 后脑勺叶芽 */
    ctx.fillStyle = palette.dark;
    ctx.beginPath();
    ctx.ellipse(-12, -16, 9, 4.5, -0.7, 0, Math.PI * 2);
    ctx.fill();
    /* 头球 */
    const g = ctx.createRadialGradient(-6, -8, 4, 0, 0, 24);
    g.addColorStop(0, palette.light);
    g.addColorStop(1, palette.base);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 21, 0, Math.PI * 2); ctx.fill();
    /* 嘴筒 */
    const rl = 22 - recoil * 6;
    ctx.fillStyle = palette.base;
    U.rr(ctx, 8, -10, rl, 20, 9);
    ctx.fill();
    ctx.fillStyle = palette.dark;
    U.rr(ctx, 8 + rl - 8, -12, 9, 24, 4);
    ctx.fill();
    /* 筒口内暗 */
    ctx.fillStyle = palette.mouth || '#1E3A10';
    ctx.beginPath();
    ctx.ellipse(8 + rl - 3, 0, 4.5, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    if (opts.frost) {
      /* 冰晶 */
      ctx.fillStyle = 'rgba(230,248,255,0.9)';
      for (let i = 0; i < 4; i++) {
        const a = i * 1.7 + 0.4;
        const cx = Math.cos(a) * 17, cy = Math.sin(a) * 15 - 3;
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(0, -5); ctx.lineTo(2.5, 0); ctx.lineTo(0, 5); ctx.lineTo(-2.5, 0);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
    /* 眼 */
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-4, -6, 5, 6.5, 0, 0, Math.PI * 2);
    ctx.ellipse(6, -6, 4.5, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(-3, -5, 2.3, 0, Math.PI * 2);
    ctx.arc(7, -5, 2.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  P.peashooter = (ctx, p) => {
    const sway = Math.sin(p.anim.t * 2 + p.seed * 5);
    stem(ctx, 40, sway);
    leafPair(ctx, 1, sway);
    shooterHead(ctx, p, { light: '#9FE86A', base: '#5DC53E', dark: '#3E9A2E' });
  };

  P.snowpea = (ctx, p) => {
    const sway = Math.sin(p.anim.t * 2 + p.seed * 5);
    stem(ctx, 40, sway);
    leafPair(ctx, 0.9, sway);
    shooterHead(ctx, p, { light: '#D8F4FF', base: '#9ADCF0', dark: '#6BB8D8', mouth: '#1A3A50' }, { frost: true });
  };

  P.repeater = (ctx, p) => {
    const sway = Math.sin(p.anim.t * 2 + p.seed * 5);
    stem(ctx, 42, sway);
    leafPair(ctx, 1, sway);
    /* 后头 */
    ctx.save();
    ctx.translate(-14, -64);
    ctx.fillStyle = '#4EB534';
    ctx.beginPath(); ctx.arc(0, 0, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3E9A2E';
    U.rr(ctx, 6, -8, 14, 16, 7); ctx.fill();
    ctx.restore();
    shooterHead(ctx, p, { light: '#9FE86A', base: '#5DC53E', dark: '#3E9A2E' });
  };

  const nutBody = (ctx, p, tall) => {
    const t = p.anim.t;
    const ratio = p.hp / p.maxHp;
    const h = tall ? 74 : 52, w = tall ? 40 : 40;
    ctx.save();
    ctx.translate(0, tall ? -4 : -2);
    /* 身体 */
    const g = ctx.createLinearGradient(-w / 2, -h, w / 2, 0);
    g.addColorStop(0, '#D8B878');
    g.addColorStop(1, '#B8905A');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, -h / 2 + 4, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#9A7040';
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 裂纹 */
    ctx.strokeStyle = '#7A5230';
    ctx.lineWidth = 2.2;
    if (ratio < 0.66) {
      ctx.beginPath();
      ctx.moveTo(-8, -h + 12);
      ctx.lineTo(-4, -h + 24); ctx.lineTo(-10, -h + 34);
      ctx.stroke();
    }
    if (ratio < 0.33) {
      ctx.beginPath();
      ctx.moveTo(12, -h + 10);
      ctx.lineTo(8, -h + 22); ctx.lineTo(14, -h + 32);
      ctx.moveTo(-2, -h + 6); ctx.lineTo(2, -h + 18);
      ctx.stroke();
    }
    /* 表情 */
    const blink = Math.sin(t * 0.8 + p.seed * 3) > 0.96;
    if (!blink) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(-9, -h * 0.62, 5.5, 7, 0, 0, Math.PI * 2);
      ctx.ellipse(9, -h * 0.62, 5.5, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(-8, -h * 0.62 + 1, 2.6, 0, Math.PI * 2);
      ctx.arc(10, -h * 0.62 + 1, 2.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.strokeStyle = '#5A4020';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-13, -h * 0.62); ctx.lineTo(-5, -h * 0.62);
      ctx.moveTo(5, -h * 0.62); ctx.lineTo(13, -h * 0.62);
      ctx.stroke();
    }
    /* 担忧的嘴 */
    ctx.strokeStyle = '#5A4020';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    const worried = ratio < 0.5;
    if (worried) {
      ctx.arc(0, -h * 0.36, 7, 1.15 * Math.PI, 1.85 * Math.PI);
    } else {
      ctx.arc(0, -h * 0.44, 7, 0.15 * Math.PI, 0.85 * Math.PI);
    }
    ctx.stroke();
    ctx.restore();
  };

  P.wallnut = (ctx, p) => nutBody(ctx, p, false);
  P.tallnut = (ctx, p) => nutBody(ctx, p, true);

  P.cherrybomb = (ctx, p) => {
    const t = p.anim.t;
    const fuse = p.anim.fuse != null ? p.anim.fuse : 0;
    const pulse = fuse > 0 ? 1 + Math.sin(t * 20) * 0.08 * (1.2 - fuse) : 1;
    ctx.save();
    ctx.scale(pulse, pulse);
    /* 茎 */
    ctx.strokeStyle = '#4E8C3A';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-14, -44); ctx.quadraticCurveTo(-6, -62, -2, -70);
    ctx.moveTo(12, -46); ctx.quadraticCurveTo(8, -60, -2, -70);
    ctx.stroke();
    /* 火花 */
    if (fuse > 0) {
      ctx.fillStyle = '#FFD800';
      ctx.beginPath();
      const s = 3 + Math.sin(t * 30) * 2;
      ctx.arc(-2, -72, s, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#FF7800';
      ctx.beginPath(); ctx.arc(-2, -72, s * 0.55, 0, Math.PI * 2); ctx.fill();
    }
    /* 双果 */
    const cherry = (x, y, r, exp) => {
      const g = ctx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
      g.addColorStop(0, exp ? '#FF8A80' : '#E84848');
      g.addColorStop(1, '#B01818');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      /* 怒眉 */
      ctx.strokeStyle = '#5A0A0A';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x - 9, y - 7); ctx.lineTo(x - 3, y - 4);
      ctx.moveTo(x + 9, y - 7); ctx.lineTo(x + 3, y - 4);
      ctx.stroke();
      /* 眼 */
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(x - 5, y, 3.5, 4.5, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 5, y, 3.5, 4.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(x - 5, y + 1, 1.8, 0, Math.PI * 2);
      ctx.arc(x + 5, y + 1, 1.8, 0, Math.PI * 2);
      ctx.fill();
    };
    cherry(-14, -32, 16, fuse > 0);
    cherry(13, -26, 17, fuse > 0);
    ctx.restore();
  };

  P.potatomine = (ctx, p) => {
    const t = p.anim.t;
    if (!p.armed) {
      /* 埋土中：土堆 + 天线尖 */
      ctx.fillStyle = '#7A5A3A';
      ctx.beginPath();
      ctx.ellipse(0, -6, 22, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#8A6B4A';
      ctx.beginPath();
      ctx.ellipse(0, -8, 16, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      const rise = p.anim.armProgress || 0;
      ctx.fillStyle = '#C8A86A';
      ctx.beginPath();
      ctx.ellipse(0, -10, 5, 4 + rise * 4, 0, 0, Math.PI * 2);
      ctx.fill();
      /* 进度微光 */
      ctx.fillStyle = `rgba(120,255,120,${0.2 + rise * 0.4})`;
      ctx.beginPath(); ctx.arc(0, -14, 1.8, 0, Math.PI * 2); ctx.fill();
    } else {
      /* 已武装 */
      ctx.fillStyle = '#C8A86A';
      ctx.strokeStyle = '#9A7848';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, -14, 22, 16, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      /* 土痕 */
      ctx.fillStyle = '#B89458';
      ctx.beginPath(); ctx.ellipse(-6, -18, 5, 3, 0.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, -10, 4, 2.5, -0.3, 0, Math.PI * 2); ctx.fill();
      /* 眼 */
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(-8, -16, 4.5, 5.5, 0, 0, Math.PI * 2);
      ctx.ellipse(8, -16, 4.5, 5.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.beginPath();
      ctx.arc(-7, -15, 2.2, 0, Math.PI * 2);
      ctx.arc(9, -15, 2.2, 0, Math.PI * 2);
      ctx.fill();
      /* 警报灯 */
      const blinkOn = Math.sin(t * 8) > 0;
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(0, -36); ctx.stroke();
      if (blinkOn) {
        ctx.fillStyle = '#FF3030';
        ctx.beginPath(); ctx.arc(0, -38, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.save();
        ctx.globalAlpha = 0.35;
        const g = ctx.createRadialGradient(0, -38, 2, 0, -38, 14);
        g.addColorStop(0, 'rgba(255,60,60,0.8)');
        g.addColorStop(1, 'rgba(255,60,60,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, -38, 14, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else {
        ctx.fillStyle = '#901818';
        ctx.beginPath(); ctx.arc(0, -38, 4, 0, Math.PI * 2); ctx.fill();
      }
    }
  };

  P.squash = (ctx, p) => {
    const t = p.anim.t;
    const look = p.anim.squashLook || 0;
    ctx.save();
    ctx.translate(0, -2);
    /* 身体 */
    const g = ctx.createLinearGradient(-22, -46, 22, 0);
    g.addColorStop(0, '#C8E890');
    g.addColorStop(1, '#9AC858');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-22, -6);
    ctx.bezierCurveTo(-26, -34, -14, -48, 0, -48);
    ctx.bezierCurveTo(16, -48, 26, -32, 22, -6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#78A040';
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 疙瘩 */
    ctx.fillStyle = '#B8D870';
    ctx.beginPath(); ctx.ellipse(-10, -36, 4, 3, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12, -28, 5, 3.5, -0.4, 0, Math.PI * 2); ctx.fill();
    /* 顶芽 */
    ctx.strokeStyle = '#6A9038';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, -48); ctx.quadraticCurveTo(3, -56, -2, -58); ctx.stroke();
    /* 怒眉 + 眼 */
    ctx.strokeStyle = '#3A5A18';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-14, -34); ctx.lineTo(-4, -30);
    ctx.moveTo(14, -34); ctx.lineTo(4, -30);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-8, -26, 4.5, 5, 0, 0, Math.PI * 2);
    ctx.ellipse(8, -26, 4.5, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(-8 + look * 2, -25, 2.2, 0, Math.PI * 2);
    ctx.arc(8 + look * 2, -25, 2.2, 0, Math.PI * 2);
    ctx.fill();
    /* 嘴 */
    ctx.strokeStyle = '#3A5A18';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(0, -16, 6, 1.2 * Math.PI, 1.8 * Math.PI);
    ctx.stroke();
    ctx.restore();
  };

  P.jalapeno = (ctx, p) => {
    const t = p.anim.t;
    const fuse = p.anim.fuse != null ? p.anim.fuse : 1;
    const shake = fuse < 1 ? Math.sin(t * 40) * 2 : 0;
    ctx.save();
    ctx.translate(shake, 0);
    /* 身体（红辣椒） */
    const g = ctx.createLinearGradient(-16, -56, 16, -4);
    g.addColorStop(0, '#FF6A50');
    g.addColorStop(1, '#C81818');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-4, -4);
    ctx.bezierCurveTo(-24, -18, -20, -48, 0, -56);
    ctx.bezierCurveTo(20, -48, 24, -18, 4, -4);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#901010';
    ctx.lineWidth = 2;
    ctx.stroke();
    /* 茎 */
    ctx.strokeStyle = '#4E8C3A';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, -56); ctx.quadraticCurveTo(2, -64, 6, -66); ctx.stroke();
    /* 怒容 */
    ctx.strokeStyle = '#5A0808';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-12, -40); ctx.lineTo(-4, -36);
    ctx.moveTo(12, -40); ctx.lineTo(4, -36);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-7, -31, 4, 5, 0, 0, Math.PI * 2);
    ctx.ellipse(7, -31, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(-7, -30, 2, 0, Math.PI * 2);
    ctx.arc(7, -30, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5A0808';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, -22, 5, 1.15 * Math.PI, 1.85 * Math.PI);
    ctx.stroke();
    ctx.restore();
  };

  P.torchwood = (ctx, p) => {
    const t = p.anim.t;
    /* 树桩 */
    const g = ctx.createLinearGradient(-24, -50, 24, 0);
    g.addColorStop(0, '#B08050');
    g.addColorStop(1, '#7A5030');
    ctx.fillStyle = g;
    U.rr(ctx, -22, -50, 44, 50, 10);
    ctx.fill();
    ctx.strokeStyle = '#5A3820';
    ctx.lineWidth = 2;
    U.rr(ctx, -22, -50, 44, 50, 10);
    ctx.stroke();
    /* 年轮顶 */
    ctx.fillStyle = '#C89868';
    ctx.beginPath();
    ctx.ellipse(0, -50, 22, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#9A7040';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(0, -50, 14, 5, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, -50, 7, 2.5, 0, 0, Math.PI * 2); ctx.stroke();
    /* 树皮纹 */
    ctx.strokeStyle = 'rgba(90,56,32,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-14, -40); ctx.quadraticCurveTo(-16, -25, -13, -10);
    ctx.moveTo(13, -38); ctx.quadraticCurveTo(15, -22, 12, -8);
    ctx.stroke();
    /* 火焰 */
    const fx = Math.sin(t * 9) * 2, fy = Math.cos(t * 7) * 2;
    ctx.fillStyle = 'rgba(255,120,20,0.85)';
    ctx.beginPath();
    ctx.moveTo(-13, -52);
    ctx.quadraticCurveTo(-16 + fx, -70, 0 + fx, -78 + fy);
    ctx.quadraticCurveTo(15 + fx, -68, 13, -52);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = 'rgba(255,220,60,0.95)';
    ctx.beginPath();
    ctx.moveTo(-7, -53);
    ctx.quadraticCurveTo(-8 + fx * 0.6, -63, 0 + fx * 0.6, -68 + fy * 0.6);
    ctx.quadraticCurveTo(8 + fx * 0.6, -62, 7, -53);
    ctx.closePath();
    ctx.fill();
    /* 眼 */
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(-8, -32, 4, 5, 0, 0, Math.PI * 2);
    ctx.ellipse(8, -32, 4, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath();
    ctx.arc(-8, -31, 2, 0, Math.PI * 2);
    ctx.arc(8, -31, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#4A2A14';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -22, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  };

  P.chomper = (ctx, p) => {
    const t = p.anim.t;
    const state = p.anim.state || 'idle';
    stem(ctx, 36, Math.sin(t * 2));
    leafPair(ctx, 0.9, Math.sin(t * 2));
    ctx.save();
    ctx.translate(0, -46 + Math.sin(t * 2.4) * 2);
    if (state === 'chewing') {
      /* 咀嚼：闭嘴 + 鼓包 */
      ctx.fillStyle = '#9A5AB8';
      ctx.beginPath(); ctx.ellipse(0, -4, 22, 18, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7A3A98';
      ctx.beginPath(); ctx.ellipse(0, 6, 16, 8, 0, 0, Math.PI * 2); ctx.fill();
      const chew = Math.sin(t * 12) * 2;
      ctx.strokeStyle = '#5A2A72';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(0, -6, 6, 1.1 * Math.PI, 1.9 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-12, -10); ctx.lineTo(-12 + chew, -2); ctx.stroke();
    } else {
      const open = state === 'biting' ? 1 : 0.35 + Math.sin(t * 2) * 0.1;
      /* 下颚 */
      ctx.fillStyle = '#8A4AA8';
      ctx.save();
      ctx.rotate(open * 0.45);
      ctx.beginPath();
      ctx.moveTo(-20, -2);
      ctx.quadraticCurveTo(0, 2, 22, -8);
      ctx.quadraticCurveTo(10, 12, -14, 10);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      /* 上颚头 */
      ctx.save();
      ctx.rotate(-open * 0.55);
      const g = ctx.createLinearGradient(0, -26, 0, 0);
      g.addColorStop(0, '#B86AD8');
      g.addColorStop(1, '#8A4AA8');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-22, 0);
      ctx.quadraticCurveTo(-26, -26, 0, -26);
      ctx.quadraticCurveTo(26, -26, 24, -2);
      ctx.quadraticCurveTo(10, 6, -22, 0);
      ctx.closePath();
      ctx.fill();
      /* 斑点 */
      ctx.fillStyle = '#6A2A88';
      ctx.beginPath(); ctx.ellipse(-12, -16, 3.5, 3, 0.3, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, -20, 3, 2.5, -0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(16, -10, 3, 2.5, 0.5, 0, Math.PI * 2); ctx.fill();
      /* 牙齿 */
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(20, -4); ctx.lineTo(26, -2); ctx.lineTo(22, 2);
      ctx.moveTo(12, -3); ctx.lineTo(17, -1); ctx.lineTo(13, 2);
      ctx.closePath(); ctx.fill();
      ctx.restore();
      /* 下颚牙 */
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.moveTo(18, 4); ctx.lineTo(24, 2); ctx.lineTo(20, 7);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  };

  SP.plant = (ctx, type, p) => {
    const fn = P[type];
    if (fn) fn(ctx, p);
  };

  /* ============ 卡片图标 ============ */
  SP.drawCard = (ctx, type, x, y, w, h, opts = {}) => {
    const def = PLANTS[type];
    ctx.save();
    /* 卡底 */
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, opts.selected ? '#F8E8B0' : '#E8D8A8');
    g.addColorStop(1, opts.selected ? '#E0C070' : '#C8B078');
    ctx.fillStyle = g;
    U.rr(ctx, x, y, w, h, 7);
    ctx.fill();
    ctx.strokeStyle = opts.selected ? '#FFF090' : '#8A7040';
    ctx.lineWidth = opts.selected ? 2.5 : 1.5;
    U.rr(ctx, x, y, w, h, 7);
    ctx.stroke();
    /* 植物图标 */
    ctx.save();
    ctx.translate(x + w / 2, y + h - 20);
    ctx.scale(0.52, 0.52);
    const fake = { anim: { t: 0 }, seed: 1, hp: 1, maxHp: 1, armed: true };
    SP.plant(ctx, type, fake);
    ctx.restore();
    /* 阳光费用 */
    ctx.save();
    ctx.translate(x + 13, y + h - 10);
    SP.sunIcon(ctx, 0, 0, 8);
    ctx.restore();
    U.text(ctx, String(def.cost), x + w - 12, y + h - 10, { size: 13, fill: '#2A2A2A', align: 'center' });
    /* 冷却遮罩 */
    if (opts.cooldown > 0) {
      ctx.fillStyle = 'rgba(20,20,20,0.62)';
      const ch = h * U.clamp(opts.cooldown, 0, 1);
      U.rr(ctx, x, y, w, ch, 7);
      ctx.fill();
    }
    /* 不可用（阳光不足） */
    if (opts.disabled) {
      ctx.fillStyle = 'rgba(40,40,60,0.45)';
      U.rr(ctx, x, y, w, h, 7);
      ctx.fill();
    }
    ctx.restore();
  };

  /* ============ 阳光 ============ */
  SP.sunIcon = (ctx, x, y, r) => {
    const g = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 1.15);
    g.addColorStop(0, '#FFF8C8');
    g.addColorStop(0.6, '#FFD838');
    g.addColorStop(1, '#F8B820');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#E8A010';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  };

  SP.drawSun = (ctx, s) => {
    const t = s.anim.t;
    ctx.save();
    ctx.translate(s.x, s.y);
    const r = s.r || 26;
    /* 光晕 */
    const halo = ctx.createRadialGradient(0, 0, r * 0.3, 0, 0, r * 1.6);
    halo.addColorStop(0, 'rgba(255,230,110,0.5)');
    halo.addColorStop(1, 'rgba(255,230,110,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, r * 1.6, 0, Math.PI * 2); ctx.fill();
    /* 光芒 */
    ctx.save();
    ctx.rotate(t * 0.8);
    ctx.fillStyle = 'rgba(255,214,64,0.85)';
    for (let i = 0; i < 8; i++) {
      ctx.save();
      ctx.rotate((i / 8) * Math.PI * 2);
      ctx.beginPath();
      ctx.moveTo(r * 0.55, -r * 0.28);
      ctx.quadraticCurveTo(r * 1.05, 0, r * 0.55, r * 0.28);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    /* 核心 */
    const g = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.1, 0, 0, r * 0.72);
    g.addColorStop(0, '#FFFEE8');
    g.addColorStop(0.55, '#FFE060');
    g.addColorStop(1, '#FFC018');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#F0A818';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  };

  /* ============ 子弹 ============ */
  SP.drawPea = (ctx, b) => {
    ctx.save();
    ctx.translate(b.x, b.y);
    if (b.type === 'fire') {
      /* 火焰尾迹 */
      ctx.fillStyle = 'rgba(255,120,20,0.5)';
      ctx.beginPath();
      ctx.ellipse(-14, 0, 12, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, 10);
      g.addColorStop(0, '#FFE080');
      g.addColorStop(0.6, '#FF8828');
      g.addColorStop(1, '#E04808');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
    } else if (b.type === 'snow') {
      const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, 10);
      g.addColorStop(0, '#E8FAFF');
      g.addColorStop(0.6, '#A8DCF8');
      g.addColorStop(1, '#68A8D8');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.stroke();
    } else {
      const g = ctx.createRadialGradient(-3, -3, 2, 0, 0, 10);
      g.addColorStop(0, '#B8F080');
      g.addColorStop(0.6, '#78C840');
      g.addColorStop(1, '#489020');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  };

  /* ============ 割草机 ============ */
  SP.drawMower = (ctx, m) => {
    ctx.save();
    ctx.translate(m.x, m.y);
    if (m.state === 'running') {
      ctx.translate(0, Math.sin(m.anim.t * 40) * -1.5);
    }
    /* 把手 */
    ctx.strokeStyle = '#606060';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-12, -14); ctx.lineTo(-26, -34);
    ctx.moveTo(-12, -14); ctx.lineTo(-20, -36);
    ctx.stroke();
    /* 机身 */
    const g = ctx.createLinearGradient(0, -22, 0, -4);
    g.addColorStop(0, '#E85838');
    g.addColorStop(1, '#B03018');
    ctx.fillStyle = g;
    U.rr(ctx, -18, -22, 38, 16, 5);
    ctx.fill();
    ctx.strokeStyle = '#802010';
    ctx.lineWidth = 1.5;
    U.rr(ctx, -18, -22, 38, 16, 5);
    ctx.stroke();
    /* 滚刀罩 */
    ctx.fillStyle = '#909090';
    U.rr(ctx, 14, -18, 12, 14, 4);
    ctx.fill();
    /* 轮子 */
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(-10, -4, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -4, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#888';
    ctx.beginPath(); ctx.arc(-10, -4, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(12, -4, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  };

  /* ============ 铲子 ============ */
  SP.drawShovel = (ctx, x, y, s = 1, angle = 0) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(s, s);
    /* 木柄 */
    ctx.strokeStyle = '#A07040';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, 6); ctx.stroke();
    /* 柄端横把 */
    ctx.strokeStyle = '#8A5A30';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(-6, -22); ctx.lineTo(6, -22); ctx.stroke();
    /* 铲头 */
    const g = ctx.createLinearGradient(-8, 6, 8, 22);
    g.addColorStop(0, '#C8C8D0');
    g.addColorStop(1, '#8888A0');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-8, 6);
    ctx.lineTo(8, 6);
    ctx.quadraticCurveTo(8, 18, 0, 24);
    ctx.quadraticCurveTo(-8, 18, -8, 6);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#606068';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  };

  /* ============ 进度条僵尸头标记 ============ */
  SP.zombieHeadIcon = (ctx, x, y, s = 1) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = '#9BB058';
    ctx.beginPath();
    ctx.ellipse(0, 0, 9, 10, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#6A7A38';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    /* 眼窝 */
    ctx.fillStyle = '#3A4A20';
    ctx.beginPath();
    ctx.ellipse(-3.5, -2, 2.2, 2.8, 0, 0, Math.PI * 2);
    ctx.ellipse(3.5, -2, 2.2, 2.8, 0, 0, Math.PI * 2);
    ctx.fill();
    /* 嘴 */
    ctx.beginPath();
    ctx.arc(0, 4, 3, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
    ctx.restore();
  };

  SP.flagIcon = (ctx, x, y, s = 1) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.strokeStyle = '#8A5A30';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(0, 10); ctx.lineTo(0, -10); ctx.stroke();
    ctx.fillStyle = '#D83020';
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(11, -6.5);
    ctx.lineTo(0, -3);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  };

  PVZ.SP = SP;
})(window);

<script>
/* web-pvz — sprites_z.js
 * 僵尸程序化绘制：7 种僵尸 + 行走/啃食/死亡动画 + 配件（路障/铁桶/报纸/头盔/旗帜/撑杆）
 */
(function (global) {
  'use strict';
  const PVZ = (global.PVZ = global.PVZ || {});
  const { U } = PVZ;
  const SZ = {};

  /* 调色板：正常 / 冰冻 */
  const PAL = {
    normal: {
      skin: '#A8B878', skinDark: '#8A9A5A', skinLine: '#6A7A40',
      shirt: '#8898A8', shirtDark: '#68788A', tie: '#B83838',
      pants: '#5A5848', hair: '#4A4A38',
    },
    chilled: {
      skin: '#8FB4D8', skinDark: '#6E96C0', skinLine: '#527898',
      shirt: '#7890B0', shirtDark: '#5A7090', tie: '#7080C0',
      pants: '#485058', hair: '#3A4450',
    },
  };
  SZ.PAL = PAL;

  /* 胶囊肢体 */
  const limb = (ctx, x0, y0, len, w, angle, color) => {
    ctx.save();
    ctx.translate(x0, y0);
    ctx.rotate(angle);
    ctx.fillStyle = color;
    U.rr(ctx, -w / 2, 0, w, len, w / 2);
    ctx.fill();
    ctx.restore();
  };

  /* 头部 */
  const head = (ctx, opt = {}) => {
    const p = opt.p;
    ctx.save();
    ctx.translate(0, -70);
    ctx.rotate(opt.tilt || 0);
    /* 后脑 */
    ctx.fillStyle = p.skinDark;
    ctx.beginPath();
    ctx.ellipse(0, 0, 14, 15.5, 0, 0, Math.PI * 2);
    ctx.fill();
    /* 脸 */
    ctx.fillStyle = p.skin;
    ctx.beginPath();
    ctx.ellipse(1, 0.5, 12.5, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = p.skinLine;
    ctx.lineWidth = 1.2;
    ctx.stroke();
    /* 凌乱头发 */
    ctx.strokeStyle = p.hair;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -12); ctx.lineTo(-10, -18);
    ctx.moveTo(-2, -14); ctx.lineTo(-2, -20);
    ctx.moveTo(5, -13); ctx.lineTo(8, -18);
    ctx.stroke();
    /* 眼窝（一只大一只小，无神） */
    ctx.fillStyle = '#3A4A28';
    ctx.beginPath();
    ctx.ellipse(3, -4, 3.6, 4.2, 0, 0, Math.PI * 2);
    ctx.ellipse(-6, -3, 2.8, 3.2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#E8E8D0';
    ctx.beginPath();
    ctx.arc(3.6, -4.6, 1.3, 0, Math.PI * 2);
    ctx.arc(-5.6, -3.6, 1, 0, Math.PI * 2);
    ctx.fill();
    /* 嘴：啃食时张合 */
    const jaw = opt.jaw || 0;
    ctx.fillStyle = '#2A3218';
    ctx.beginPath();
    ctx.ellipse(4, 6, 5.5, 2 + jaw * 5, 0, 0, Math.PI * 2);
    ctx.fill();
    /* 牙 */
    ctx.fillStyle = '#D8D8C0';
    ctx.beginPath();
    ctx.rect(1.5, 4, 2.2, 2.5);
    ctx.rect(5.5, 4, 2.2, 2.5);
    ctx.fill();
    ctx.restore();
  };

  /* 路障锥 */
  const cone = (ctx) => {
    ctx.save();
    ctx.translate(0, -84);
    ctx.rotate(-0.06);
    const g = ctx.createLinearGradient(-12, 0, 12, 0);
    g.addColorStop(0, '#F89838');
    g.addColorStop(1, '#D87018');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-13, 8);
    ctx.quadraticCurveTo(-4, -8, -2.5, -26);
    ctx.lineTo(2.5, -26);
    ctx.quadraticCurveTo(4, -8, 13, 8);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#F0F0E8';
    ctx.beginPath();
    ctx.moveTo(-9.5, 1); ctx.lineTo(-7, -10); ctx.lineTo(7, -10); ctx.lineTo(9.5, 1);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#A85818';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-13, 8); ctx.quadraticCurveTo(-4, -8, -2.5, -26);
    ctx.lineTo(2.5, -26); ctx.quadraticCurveTo(4, -8, 13, 8);
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  };

  /* 铁桶 */
  const bucket = (ctx, dented) => {
    ctx.save();
    ctx.translate(0, -85);
    ctx.rotate(-0.05);
    const g = ctx.createLinearGradient(-14, 0, 14, 0);
    g.addColorStop(0, '#B8BCC0');
    g.addColorStop(0.5, '#989CA2');
    g.addColorStop(1, '#787C84');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-13, -26);
    ctx.lineTo(13, -26);
    ctx.lineTo(15, 8);
    ctx.lineTo(-15, 8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5A5E64';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    /* 桶箍 */
    ctx.strokeStyle = '#C8CCD0';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-14.2, -18); ctx.lineTo(14.2, -18);
    ctx.moveTo(-14.8, -2); ctx.lineTo(14.8, -2);
    ctx.stroke();
    /* 凹痕 */
    if (dented) {
      ctx.strokeStyle = '#606468';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-6, -22); ctx.lineTo(-2, -14); ctx.lineTo(-7, -6);
      ctx.stroke();
    }
    ctx.restore();
  };

  /* 报纸 */
  const newspaper = (ctx) => {
    ctx.save();
    ctx.translate(6, -42);
    ctx.rotate(0.12);
    ctx.fillStyle = '#E8E8E0';
    U.rr(ctx, -16, -14, 34, 28, 2);
    ctx.fill();
    ctx.strokeStyle = '#B0B0A8';
    ctx.lineWidth = 1;
    U.rr(ctx, -16, -14, 34, 28, 2);
    ctx.stroke();
    /* 标题条 */
    ctx.fillStyle = '#787870';
    ctx.fillRect(-13, -11, 28, 4);
    /* 文字行 */
    ctx.fillStyle = '#A8A8A0';
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(-13, -4 + i * 5, 22 - (i % 2) * 8, 2.4);
    }
    ctx.restore();
  };

  /* 橄榄头盔 */
  const footballHelmet = (ctx) => {
    ctx.save();
    ctx.translate(0, -82);
    const g = ctx.createLinearGradient(-14, -10, 14, 10);
    g.addColorStop(0, '#E85858');
    g.addColorStop(1, '#B02828');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, -4, 15, 14, 0, Math.PI * 0.95, Math.PI * 2.05);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#801818';
    ctx.lineWidth = 1.4;
    ctx.stroke();
    /* 白条 */
    ctx.strokeStyle = '#F0F0F0';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -18); ctx.lineTo(0, 8);
    ctx.stroke();
    /* 面罩 */
    ctx.strokeStyle = '#C8C8D0';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(13, -2);
    ctx.quadraticCurveTo(18, 4, 13, 9);
    ctx.moveTo(13, 1); ctx.lineTo(8, 2);
    ctx.moveTo(13, 6); ctx.lineTo(8, 7);
    ctx.stroke();
    ctx.restore();
  };

  /* 旗帜 */
  const flagPole = (ctx, t) => {
    ctx.save();
    ctx.translate(8, -52);
    ctx.rotate(-0.5);
    ctx.strokeStyle = '#8A5A30';
    ctx.lineWidth = 2.6;
    ctx.beginPath(); ctx.moveTo(0, 18); ctx.lineTo(0, -46); ctx.stroke();
    const wave = Math.sin(t * 6) * 4;
    ctx.fillStyle = '#D83020';
    ctx.beginPath();
    ctx.moveTo(0, -46);
    ctx.quadraticCurveTo(14, -42 + wave, 26, -38 + wave);
    ctx.quadraticCurveTo(14, -34 + wave, 0, -30);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#F0E8C8';
    ctx.beginPath();
    ctx.arc(10, -38 + wave * 0.5, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  /* 撑杆 */
  const vaultPole = (ctx, angle) => {
    ctx.save();
    ctx.translate(4, -40);
    ctx.rotate(angle != null ? angle : -0.9);
    ctx.strokeStyle = '#C8A860';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(0, -34); ctx.stroke();
    ctx.strokeStyle = '#A88848';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-1.5, 26); ctx.lineTo(-1.5, -34); ctx.stroke();
    ctx.restore();
  };

  /* ============ 主体绘制 ============ */
  /*
   * z: 僵尸实例 {
   *   type, anim: {t, phase, eating, dying, deathT, walkSpeed, jaw, rage, chilled...}
   * }
   */
  SZ.draw = (ctx, z) => {
    const t = z.anim.t;
    const pal = z.chill > 0 ? PAL.chilled : PAL.normal;
    const eating = z.anim.eating;
    const dying = z.anim.dying;
    const phase = t * (z.anim.walkRate || 3);

    ctx.save();
    /* 死亡：前倾倒下 */
    if (dying) {
      const dp = U.clamp(z.anim.deathT / 0.9, 0, 1);
      const rot = (1 - Math.pow(1 - dp, 2)) * 1.45;
      ctx.translate(0, 0);
      ctx.rotate(rot);
      ctx.globalAlpha = z.anim.deathT > 1.1 ? U.clamp(1 - (z.anim.deathT - 1.1) / 0.6, 0, 1) : 1;
    }

    /* 阴影在 board 层统一绘制 */

    const legSwing = eating ? 0.08 : Math.sin(phase) * 0.32;
    const bob = eating ? 0 : Math.abs(Math.sin(phase)) * 2.2;
    const lean = eating ? 0.1 : 0.08 + Math.sin(phase * 0.5) * 0.02;

    /* —— 远侧腿 —— */
    limb(ctx, -2, -38, 36, 9, -legSwing + 0.06, pal.pants);
    /* —— 远侧手臂（前伸摆动） —— */
    const armSwing = eating ? Math.sin(t * 10) * 0.22 : Math.sin(phase + Math.PI) * 0.1;
    limb(ctx, -3, -60 + bob * 0.5, 30, 8, 1.25 + armSwing, pal.shirtDark);
    /* 手 */
    ctx.save();
    ctx.translate(-3 + Math.cos(1.25 + armSwing) * 30, -60 + bob * 0.5 + Math.sin(1.25 + armSwing) * 30);
    ctx.fillStyle = pal.skinDark;
    ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    /* —— 躯干 —— */
    ctx.save();
    ctx.translate(0, bob * 0.4);
    ctx.rotate(lean);
    /* 衬衫 */
    const tg = ctx.createLinearGradient(-11, 0, 11, 0);
    tg.addColorStop(0, pal.shirt);
    tg.addColorStop(1, pal.shirtDark);
    ctx.fillStyle = tg;
    U.rr(ctx, -11, -64, 22, 30, 6);
    ctx.fill();
    /* 破烂下摆 */
    ctx.fillStyle = pal.shirtDark;
    ctx.beginPath();
    ctx.moveTo(-11, -36);
    ctx.lineTo(-11, -32); ctx.lineTo(-6, -36); ctx.lineTo(-2, -31);
    ctx.lineTo(3, -36); ctx.lineTo(8, -32); ctx.lineTo(11, -35);
    ctx.lineTo(11, -36);
    ctx.closePath();
    ctx.fill();
    /* 领带 */
    ctx.fillStyle = pal.tie;
    ctx.beginPath();
    ctx.moveTo(2, -62); ctx.lineTo(7, -60); ctx.lineTo(6, -46); ctx.lineTo(2, -44);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    /* —— 近侧腿 —— */
    limb(ctx, 3, -38, 38, 10, legSwing, pal.pants);
    ctx.save();
    ctx.translate(3 + Math.sin(legSwing) * 34, -38 + Math.cos(legSwing) * 34);
    ctx.fillStyle = '#3A382E';
    U.rr(ctx, -6, -4, 12, 6, 2);
    ctx.fill();
    ctx.restore();

    /* —— 头 —— */
    ctx.save();
    ctx.translate(2, bob * 0.5 + (eating ? Math.sin(t * 10) * 1.2 : Math.sin(phase) * 1.4));
    head(ctx, {
      p: pal,
      tilt: lean * 0.7 + (eating ? 0.12 : 0),
      jaw: eating ? (Math.sin(t * 10) * 0.5 + 0.5) : (dying ? 0.6 : 0.12),
    });
    ctx.restore();

    /* —— 配件 —— */
    switch (z.type) {
      case 'cone':
        if (z.helmHp > 0) {
          ctx.save();
          ctx.translate(2, bob * 0.5 + (eating ? Math.sin(t * 10) * 1.2 : Math.sin(phase) * 1.4));
          cone(ctx, z.helmHp < z.helmMaxHp * 0.35);
          ctx.restore();
        }
        break;
      case 'bucket':
        if (z.helmHp > 0) {
          ctx.save();
          ctx.translate(2, bob * 0.5 + (eating ? Math.sin(t * 10) * 1.2 : Math.sin(phase) * 1.4));
          bucket(ctx, z.helmHp < z.helmMaxHp * 0.35);
          ctx.restore();
        }
        break;
      case 'football':
        if (z.helmHp > 0) {
          ctx.save();
          ctx.translate(2, bob * 0.5 + (eating ? Math.sin(t * 10) * 1.2 : Math.sin(phase) * 1.4));
          footballHelmet(ctx);
          ctx.restore();
        }
        break;
      case 'flag':
        flagPole(ctx, t);
        break;
      case 'pole':
        if (!z.hasVaulted && !z.anim.dying) vaultPole(ctx, z.anim.poleAngle);
        break;
    }

    /* —— 近侧手臂（最前层） —— */
    const armSwing2 = eating ? Math.sin(t * 10 + Math.PI) * 0.25 : Math.sin(phase) * 0.12;
    const reach = z.type === 'football' && !eating ? 0.9 : 1.25;
    limb(ctx, 4, -58 + bob * 0.5, 32, 9, reach - armSwing2, pal.shirt);
    ctx.save();
    const ax = 4 + Math.cos(reach - armSwing2) * 32;
    const ay = -58 + bob * 0.5 + Math.sin(reach - armSwing2) * 32;
    ctx.translate(ax, ay);
    ctx.fillStyle = pal.skin;
    ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
    /* 手指 */
    ctx.strokeStyle = pal.skinLine;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(2, -3); ctx.lineTo(7, -5);
    ctx.moveTo(2, 0); ctx.lineTo(8, 0);
    ctx.stroke();
    ctx.restore();

    /* 报纸（手前） */
    if (z.type === 'news' && z.shieldHp > 0 && !dying) {
      newspaper(ctx);
    }

    ctx.restore();
  };

  /* 撑杆跳过程（空中姿态）单独绘制 */
  SZ.drawVaulting = (ctx, z) => {
    const pal = z.chill > 0 ? PAL.chilled : PAL.normal;
    const t = z.anim.t;
    ctx.save();
    ctx.rotate(-0.35 + Math.sin(t * 4) * 0.1);
    /* 蜷腿姿态 */
    limb(ctx, -2, -38, 34, 9, 0.7, pal.pants);
    limb(ctx, 3, -38, 34, 10, 0.95, pal.pants);
    const tg = ctx.createLinearGradient(-11, 0, 11, 0);
    tg.addColorStop(0, pal.shirt);
    tg.addColorStop(1, pal.shirtDark);
    ctx.fillStyle = tg;
    U.rr(ctx, -11, -64, 22, 30, 6);
    ctx.fill();
    ctx.save();
    ctx.translate(2, 0);
    head(ctx, { p: pal, tilt: 0.3, jaw: 0.3 });
    ctx.restore();
    limb(ctx, 4, -58, 32, 9, 1.9, pal.shirt);
    limb(ctx, -3, -60, 30, 8, 2.2, pal.shirtDark);
    ctx.restore();
  };

  PVZ.SZ = SZ;
})(window);

</script>
<script>
/* web-pvz — entities.js
 * 游戏实体：植物 / 僵尸 / 子弹 / 阳光 / 割草机 / 粒子 / 浮动文字
 * 数值源自 data.js（PvZ-Portable / PVZ-Godot-Dream 提取）
 */
(function (global) {
  'use strict';
  const PVZ = (global.PVZ = global.PVZ || {});
  const { U, G, PLANTS, ZOMBIES, ZOMBIE_DPS, CHILL_FACTOR } = PVZ;
  const { SP, SZ, A } = PVZ;

  /* ============ 基类 ============ */
  class Entity {
    constructor() {
      this.dead = false;
      this.anim = { t: U.rand(0, 10) };
      this.seed = Math.random();
    }
    update(dt) { this.anim.t += dt; }
  }

  /* ============ 植物 ============ */
  class Plant extends Entity {
    constructor(type, row, col) {
      super();
      const def = PLANTS[type];
      this.type = type;
      this.def = def;
      this.row = row;
      this.col = col;
      this.x = G.cellCenterX(col);
      this.y = G.GRID_Y + (row + 1) * G.CELL_H - 8;
      this.hp = def.hp;
      this.maxHp = def.hp;
      this.eatenBy = 0;

      /* 状态 */
      this.shootTimer = 0;
      this.sunTimer = U.rand(def.sun ? def.sun.first[0] : 0, def.sun ? def.sun.first[1] : 0);
      this.sunGlow = 0;
      this.armed = type !== 'potatomine';
      this.armTimer = def.arm || 0;
      this.fuse = null;         /* 樱桃/辣椒引信剩余 */
      this.chewTimer = 0;       /* 大嘴花咀嚼 */
      this.state = 'idle';
      this.biteAnim = 0;
      this.recoil = 0;
      this.squashState = 'wait';
      this.squashJumpT = 0;
      this.squashTargetX = 0;
      this.squashLook = 0;
      this.eatingShake = 0;
    }

    update(dt, board) {
      super.update(dt);
      const def = this.def;
      this.recoil = Math.max(0, this.recoil - dt * 5);
      if (this.eatenBy > 0) this.eatingShake = Math.sin(this.anim.t * 22) * 1.2;
      else this.eatingShake = 0;

      switch (this.type) {
        case 'sunflower': {
          this.sunTimer -= dt;
          this.sunGlow = this.sunTimer < 1.5 ? 1 - this.sunTimer / 1.5 : 0;
          if (this.sunTimer <= 0) {
            this.sunTimer = U.rand(def.sun.next[0], def.sun.next[1]);
            board.spawnSunAt(this.x + U.rand(-14, 14), this.y - 40, 25, 'flower');
            A.S.sunspawn();
          }
          break;
        }
        case 'peashooter':
        case 'snowpea':
        case 'repeater': {
          this.shootTimer -= dt;
          if (this.shootTimer <= 0) {
            const zombieAhead = board.zombieInRowAhead(this.row, this.x - 30);
            if (zombieAhead) {
              this.shootTimer = def.shoot.interval;
              const count = def.shoot.count || 1;
              for (let i = 0; i < count; i++) {
                board.delayed(i * 0.16, () => {
                  if (this.dead) return;
                  board.projectiles.push(new Projectile(
                    def.shoot.chill ? 'snow' : 'pea',
                    this.x + 26, this.y - 52, this.row, def.shoot.dmg
                  ));
                  this.recoil = 1;
                  A.S.shoot();
                });
              }
            } else {
              this.shootTimer = 0.1;
            }
          }
          break;
        }
        case 'potatomine': {
          if (!this.armed) {
            this.armTimer -= dt;
            this.anim.armProgress = 1 - this.armTimer / (def.arm || 1);
            if (this.armTimer <= 0) {
              this.armed = true;
              A.S.plant();
            }
          } else {
            const z = board.zombieNearRow(this.row, this.x, 46);
            if (z) {
              board.explode(this.x, this.row, 55, def.dmg, 'potato');
              this.dead = true;
            }
          }
          break;
        }
        case 'cherrybomb': {
          if (this.fuse == null) this.fuse = def.fuse;
          this.fuse -= dt;
          this.anim.fuse = this.fuse / def.fuse;
          if (this.fuse <= 0) {
            board.explode(this.x, this.row, def.radius * G.CELL_W * 0.75, def.dmg, 'cherry');
            this.dead = true;
          }
          break;
        }
        case 'jalapeno': {
          if (this.fuse == null) this.fuse = def.fuse;
          this.fuse -= dt;
          this.anim.fuse = this.fuse / def.fuse;
          if (this.fuse <= 0) {
            board.fireRow(this.row, def.dmg);
            this.dead = true;
          }
          break;
        }
        case 'squash': {
          if (this.squashState === 'wait') {
            const z = board.zombieNearRow(this.row, this.x, 62);
            this.squashLook = Math.sin(this.anim.t * 1.5) * 1.2;
            if (z) {
              this.squashState = 'jump';
              this.squashJumpT = 0;
              this.squashTargetX = z.x;
              A.S.vault();
            }
          } else if (this.squashState === 'jump') {
            this.squashJumpT += dt;
            if (this.squashJumpT >= 0.75) {
              board.explode(this.squashTargetX, this.row, 55, def.dmg, 'squash');
              A.S.explode();
              this.dead = true;
            }
          }
          break;
        }
        case 'chomper': {
          if (this.state === 'chewing') {
            this.chewTimer -= dt;
            if (this.chewTimer <= 0) this.state = 'idle';
          } else if (this.state === 'biting') {
            this.biteAnim += dt;
            if (this.biteAnim >= 0.4) {
              const z = this.biteTarget;
              if (z && !z.dead && !z.anim.dying) {
                z.instantKill(board);
                A.S.chomp();
                board.delayed(0.35, () => A.S.swallow());
              }
              this.state = 'chewing';
              this.chewTimer = def.chew;
              this.anim.state = 'chewing';
            }
          } else {
            /* 待机：寻找近处僵尸 */
            const z = board.zombieNearRow(this.row, this.x + 30, 78);
            if (z && z.x > this.x - 20) {
              this.state = 'biting';
              this.biteAnim = 0;
              this.biteTarget = z;
              this.anim.state = 'biting';
            }
          }
          break;
        }
      }
    }

    draw(ctx) {
      ctx.save();
      ctx.translate(this.x + this.eatingShake, this.y);
      /* 倭瓜跳跃 */
      if (this.type === 'squash' && this.squashState === 'jump') {
        const p = this.squashJumpT / 0.75;
        const jumpX = U.lerp(this.x, this.squashTargetX, U.clamp(p * 1.6, 0, 1));
        const jumpY = -Math.sin(U.clamp(p * 1.6, 0, 1) * Math.PI) * 70;
        ctx.restore();
        ctx.save();
        ctx.translate(jumpX, this.y + jumpY);
        ctx.scale(1.15, 0.92);
      }
      /* 大嘴花咀嚼鼓包进度传递 */
      if (this.type === 'chomper') {
        this.anim.state = this.state === 'chewing' ? 'chewing' : (this.state === 'biting' ? 'biting' : 'idle');
      }
      SP.plant(ctx, this.type, this);
      ctx.restore();
    }
  }

  /* ============ 僵尸 ============ */
  class Zombie extends Entity {
    constructor(type, row, board) {
      super();
      const def = ZOMBIES[type];
      this.type = type;
      this.def = def;
      this.row = row;
      this.board = board;
      this.x = G.SPAWN_X + U.rand(0, 50);
      this.y = G.GRID_Y + (row + 1) * G.CELL_H - 6;
      this.bodyHp = def.body;
      this.bodyMaxHp = def.body;
      this.helmHp = def.helm || 0;
      this.helmMaxHp = def.helm || 0;
      this.shieldHp = def.shield || 0;
      this.shieldMaxHp = def.shield || 0;
      this.speed = U.rand(def.speed[0], def.speed[1]);
      this.chill = 0;
      this.eating = null;
      this.anim.eating = false;
      this.anim.dying = false;
      this.anim.deathT = 0;
      this.anim.walkRate = 2.2 + this.speed * 0.14;
      this.anim.jaw = 0;
      this.eatSoundT = 0;
      this.groanT = U.rand(2, 9);
      /* 撑杆跳 */
      this.hasVaulted = false;
      this.vaultT = 0;
      this.vaultFrom = 0;
      this.vaultTo = 0;
      this.anim.poleAngle = -0.9;
      /* 报纸狂暴 */
      this.rage = false;
      this.ragePause = 0;
      /* 铁桶掉落 */
      this.helmFallT = 0;
    }

    get alive() { return !this.dead && !this.anim.dying; }

    hit(dmg, opts = {}) {
      if (!this.alive) return;
      let remaining = dmg;
      /* 火焰伤害解除冰冻 */
      if (opts.fire && this.chill > 0) this.chill = 0;
      /* 报纸 */
      if (this.shieldHp > 0) {
        const absorbed = Math.min(this.shieldHp, remaining);
        this.shieldHp -= absorbed;
        remaining -= absorbed;
        if (this.shieldHp <= 0 && this.type === 'news') {
          this.rage = true;
          this.ragePause = 0.6;
          this.speed = U.rand(this.def.rageSpeed[0], this.def.rageSpeed[1]);
          this.anim.walkRate = 5;
          A.S.rip();
          A.S.groan();
        }
      }
      /* 头部护甲 */
      if (remaining > 0 && this.helmHp > 0) {
        const absorbed = Math.min(this.helmHp, remaining);
        this.helmHp -= absorbed;
        remaining -= absorbed;
        if (this.helmHp <= 0) {
          /* 护甲脱落粒子 */
          this.board.spawnHelmFall(this.type, this.x, this.y - 80);
        }
      }
      /* 身体 */
      if (remaining > 0) {
        this.bodyHp -= remaining;
        if (opts.chill) {
          this.chill = Math.max(this.chill, opts.chill);
          A.S.freeze();
        }
        if (this.bodyHp <= 0) this.die();
      } else if (opts.chill) {
        this.chill = Math.max(this.chill, opts.chill);
      }
    }

    instantKill(board) {
      if (!this.alive) return;
      this.bodyHp = 0;
      this.helmHp = 0;
      this.shieldHp = 0;
      this.die(true);
    }

    die(swallowed) {
      if (this.anim.dying) return;
      this.anim.dying = true;
      this.anim.deathT = 0;
      this.anim.eating = false;
      this.eating = null;
      if (!swallowed) {
        this.board.spawnHeadFall(this.x, this.y - 78, this.chill > 0);
        A.S.groan();
      }
      this.board.onZombieDeath(this);
    }

    update(dt, board) {
      super.update(dt);
      /* 死亡动画推进 */
      if (this.anim.dying) {
        this.anim.deathT += dt;
        if (this.anim.deathT > 1.7) this.dead = true;
        return;
      }
      /* 冰冻计时 */
      if (this.chill > 0) this.chill -= dt;
      const chillF = this.chill > 0 ? CHILL_FACTOR : 1;

      /* 狂暴停顿 */
      if (this.ragePause > 0) {
        this.ragePause -= dt;
        return;
      }

      /* 撑杆跳空中 */
      if (this.vaultT > 0) {
        this.vaultT -= dt;
        const p = 1 - this.vaultT / 0.65;
        this.x = U.lerp(this.vaultFrom, this.vaultTo, U.clamp(p, 0, 1));
        this.anim.poleAngle = -0.9 - p * 0.8;
        if (this.vaultT <= 0) {
          this.hasVaulted = true;
          this.speed = U.rand(13.8, 20);
          this.anim.walkRate = 2.4;
        }
        return;
      }

      /* 随机低吼 */
      this.groanT -= dt;
      if (this.groanT <= 0) {
        this.groanT = U.rand(6, 14);
        if (Math.random() < 0.5) A.S.groan();
      }

      /* 寻找面前的植物 */
      const mouthX = this.x - 18;
      const plant = board.plantAtZombie(this.row, mouthX);
      if (plant && !plant.dead) {
        /* 撑杆跳触发（高坚果不可跳过） */
        if (this.type === 'pole' && !this.hasVaulted && plant.type !== 'tallnut') {
          this.vaultT = 0.65;
          this.vaultFrom = this.x;
          this.vaultTo = plant.x - 38;
          A.S.vault();
          return;
        }
        /* 啃食（引用只登记一次） */
        if (this.eating !== plant) {
          if (this.eating && !this.eating.dead) {
            this.eating.eatenBy = Math.max(0, this.eating.eatenBy - 1);
          }
          this.eating = plant;
          plant.eatenBy++;
        }
        this.anim.eating = true;
        const dps = ZOMBIE_DPS * chillF * (this.rage ? 1.5 : 1);
        plant.hp -= dps * dt;
        this.eatSoundT -= dt;
        if (this.eatSoundT <= 0) {
          this.eatSoundT = 0.42;
          A.S.eat();
        }
        if (plant.hp <= 0) {
          this.eating = null;
          this.anim.eating = false;
          board.killPlant(plant, 'eaten');
        }
      } else {
        if (this.eating) {
          if (!this.eating.dead) this.eating.eatenBy = Math.max(0, this.eating.eatenBy - 1);
          this.eating = null;
        }
        this.anim.eating = false;
        /* 移动 */
        this.x -= this.speed * chillF * dt;
      }

      /* 到达割草机线/房子 */
      if (this.x < G.MOWER_X + 45) {
        board.zombieReachedHouse(this);
      }
    }

    draw(ctx) {
      /* 阴影 */
      ctx.save();
      ctx.globalAlpha = 0.22;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(this.x, this.y + 4, 22, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(this.x, this.y);
      if (this.vaultT > 0) {
        SZ.drawVaulting(ctx, this);
      } else {
        SZ.draw(ctx, this);
      }
      ctx.restore();
    }
  }
